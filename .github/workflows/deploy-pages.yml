name: Déployer le beta (GitHub Pages)

# Publie app/ tel quel — c'est déjà un site statique autonome (prototype.html,
# engine.js, llm_bridge.js, vendor/pyodide/, data/*.json). Aucune étape de
# build : le YAML source (grammar/modele.yaml, traducteur/lexique.yaml) est
# déjà compilé en JSON dans app/data/ par app/build_data.sh et commité — ce
# workflow ne fait que publier ce qui existe déjà dans le dépôt.
#
# Contrairement à un Artifact Claude (CSP stricte, aucun appel réseau sortant
# possible), une page GitHub Pages est une page web normale : le moteur flou
# (LLM, clé personnelle, Réglages) et la discussion à plusieurs tours
# fonctionnent ici, à condition d'avoir une vraie connexion Internet (donc
# jamais une fois connecté au Wi-Fi de la console — voir APP.md).
#
# Ce fichier vit délibérément à la fois ici (branche de développement) ET
# sur la branche par défaut du dépôt : GitHub n'enregistre les déclencheurs
# `on: push` d'un workflow que depuis la branche par défaut — un fichier qui
# n'existe que sur une branche non défaut ne se déclenche jamais, même sur
# un push qui le touche lui-même (limite documentée de GitHub Actions,
# trouvée le 2026-08-14 : 0 exécution malgré deux push correspondant au
# filtre). Le `ref:` explicite du checkout ci-dessous garantit que c'est
# toujours le contenu de la branche de développement qui est publié, jamais
# celui — différent, plus ancien — de la branche par défaut.
#
# Pas de bloc `environment: github-pages` sur le job (délibéré) : GitHub crée
# par défaut une règle de protection sur cet environnement qui restreint les
# déploiements à la branche par défaut du dépôt — un `push` déclenché depuis
# cette branche de développement échouait donc systématiquement (0 seconde,
# aucune étape exécutée), alors qu'un déclenchement manuel depuis la branche
# par défaut passait. `actions/deploy-pages` n'a pas besoin de ce bloc pour
# fonctionner (OIDC via `id-token: write` suffit) — il ne sert qu'à afficher
# l'URL de déploiement dans l'UI GitHub, qu'on perd ici sans conséquence.
# Trouvé le 2026-08-17 en comparant les runs qui passaient vs échouaient.
#
# Cache-bust sur engine.js/llm_bridge.js à chaque déploiement (étape ci-
# dessous) : un utilisateur avait encore le HTTP 400 de llm_bridge.js
# longtemps après le correctif — son navigateur mobile servait une copie
# en cache, sans jamais revalider. `engine.js` et `llm_bridge.js`
# détectaient déjà un `?...` sur leur propre <script src> (regex
# `(\?|$)` pour retrouver BASE), pensé pour ça mais jamais branché avant
# le 2026-08-18. `prototype.html` n'est pas lui-même versionné : GitHub
# Pages sert le HTML avec un cache court (revalidation fréquente), c'est
# lui qui doit rester la source de vérité sur QUELLE version des scripts
# charger.

on:
  push:
    branches: [claude/macro2eos-app-design-autk7k]
    paths: ["app/**"]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/macro2eos-app-design-autk7k
      - name: Cache-bust engine.js et llm_bridge.js (voir commentaire en tête de fichier)
        run: |
          sed -i "s/engine\.js\"/engine.js?v=${{ github.sha }}\"/" app/prototype.html
          sed -i "s/llm_bridge\.js\"/llm_bridge.js?v=${{ github.sha }}\"/" app/prototype.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
