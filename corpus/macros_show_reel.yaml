# Macros réelles d'un show francophone tiers — captures d'écran, 2026-09-13.
#
# CE FICHIER N'EST PAS UNE SOURCE DE SYNTAXE À GÉNÉRER DEPUIS. Confiance B :
# show réel transmis par un tiers (l'utilisateur du projet donne une
# confiance de 95 % sur l'authenticité, mais ne l'a pas programmé lui-même et
# ne l'a pas testé à son banc). Sert de PREUVE pour deux choses :
#
#   1. la question de localisation FR de `reference/journal_questions.yaml`
#      (entrée du 2026-09-09) : le CONTENU de macro lui-même (pas seulement
#      l'affichage) porte des tokens français — la saisie/le stockage
#      changent bel et bien avec la langue de la console, pas seulement le
#      rendu visuel ;
#   2. un réservoir de vocabulaire FR->EN à faire entrer dans
#      `traducteur/lexique.yaml`, chaque token étant d'abord vérifié contre
#      `reference/eosKeys.ts` ou le manuel avant d'être retenu — jamais recopié
#      à l'aveugle (même discipline que pour tout corpus tiers, voir
#      HANDOFF_TRADUCTEUR.md §8).
#
# `♦` = Enter, tel qu'affiché par la console (confirmé par capture le
# 2026-09-09, voir journal_questions.yaml).

meta:
  version: "0.1"
  source: >-
    Captures d'écran de l'éditeur de macros (colonnes Macro/Label/Color/
    Mode/Contenu), show réel d'un tiers, transmises en conversation le
    2026-09-13.
  confiance: "B"

# --------------------------------------------------------------------------
# TOKENS FR -> EN, chacun vérifié contre reference/eosKeys.ts avant d'être
# retenu ici (colonne `source`). Aucun ajouté au lexique tant que ce fichier
# n'a pas été relu et arbitré explicitement.
# --------------------------------------------------------------------------
vocabulaire_fr_en:
  Attente_Enter:        { en: "Wait_For_Enter",      osc: wait_for_enter,   source: "eosKeys.ts" }
  Effacer_Ligne_Cmd:    { en: "Clear_CmdLine",        osc: clear_cmdline,    interne: RESET_COMMAND_LINE, source: "eosKeys.ts" }
  Par_Type:             { en: "By_Type",              osc: by_type,          interne: BY_TYPE_PALETTE, source: "eosKeys.ts" }
  Convertir_en_Manuel:  { en: "Make_Manual",          osc: make_manual,      interne: MAKE_MANUAL, source: "eosKeys.ts" }
  Conv_en_val_absolue:  { en: "Make_Absolute",        osc: make_absolute,    interne: MAKE_ABSOLUTE, source: "eosKeys.ts" }
  Select_Last:          { en: "Select_Last",          osc: select_last,      interne: SELECT_LAST, source: "eosKeys.ts (déjà identique)" }
  Palette_Couleur:      { en: "Color_Palette",        source: "cohérent avec modele.yaml, non un nom de touche isolé" }
  CueOnlyTrack:         { en: "CueOnlyTrack",          osc: cueonlytrack,     interne: CUE_ONLY_TRACK, source: "eosKeys.ts (déjà identique)" }
  Tous_les_Workspaces:  { en: "All_Workspaces",       osc: all_workspaces,   interne: ALL_WORKSPACES, source: "eosKeys.ts" }
  Direct_Selects:       { en: "Direct_Selects",       osc: direct_selects,   interne: SNAPSHOT_DIRECT_SELECTS, source: "eosKeys.ts (déjà identique)" }
  Favoris:              { en: "Favorite",             source: "manuel §23 l.51 (« Favorite »), catégorie de capture Snapshot" }
  Cue Précédent:        { en: "Cue Last",             source: "cohérent avec objets_cible/cibles de cue déjà connues" }
  Blind:                { en: "Blind",                osc: blind,            interne: PREVIEW, source: "eosKeys.ts (déjà identique)" }
  Snapshot:              { en: "Snapshot",             osc: snapshot,         interne: SNAPSHOT, source: "eosKeys.ts (déjà identique)" }
  Tab_Bas / Tab_Haut:   { en: "[Tab] tenu appuyé pendant la frappe du numéro",
                          source: "manuel §23 l.99 — « Press [Tab] [1] [9] » = Tab 19, confirmé par TAB19/TAB27/TAB36/TAB39" }

# Non vérifié / non résolu — À NE PAS faire entrer au lexique en l'état :
non_resolu:
  - token: "Autre"
    contexte: "catégorie de capture Snapshot (macro 2002, avec Favoris)"
    statut: >-
      CONFIRMÉ AU BANC RÉEL le 2026-09-13 (confiance S, distinct de ce
      fichier B) — voir journal_questions.yaml. Le manuel §23 ne liste pas
      cette catégorie explicitement ; le banc a raison contre le manuel ici.

