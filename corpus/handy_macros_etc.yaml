    cause: sens_non_atteste
    cause_detail: >-
      La feuille écrit `Out Group Next Level` et le label se lit « passe au
      groupe suivant ». Or le manuel §7 l. 175 dit l'inverse : après une
      sélection de groupe, `Next` accède au PREMIER CIRCUIT ORDONNÉ du groupe
      et parcourt ses circuits — il ne passe pas au groupe suivant. Aucune
      source n'atteste le sens que le label suggère. Le traducteur refuse donc
      en l'expliquant plutôt que de rendre un `Next` qui serait syntaxiquement
      valide et ferait autre chose que la demande.

