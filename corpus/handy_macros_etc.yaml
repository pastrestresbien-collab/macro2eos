# Feuille collaborative ETC « Handy Macros » — transcription pour rétro-traduction.
#
# CE FICHIER N'EST PAS UNE SOURCE DE SYNTAXE. Sa syntaxe est de confiance B
# (praticiens réels, console réelle, non testée ici) et une entrée au moins est
# démontrablement fausse — voir `Quickstep`, dont le manuel §16 contredit la
# description. On ne génère JAMAIS depuis ce fichier : il sert d'ORACLE
# INDÉPENDANT, c'est-à-dire d'occasion de faire échouer le traducteur.
#
# Audit complet : reference/journal_questions.yaml, entrée du 2026-09-08.
#
# Discipline de rédaction — la seule chose qui rend ce test honnête :
#   `demande_nl` est écrite depuis les colonnes Label et Note de la feuille,
#   traduites littéralement, AVANT toute exécution du traducteur. Formuler la
#   phrase française d'après ce que le lexique sait déjà accepter viderait le
#   test de son contenu : il ne mesurerait plus que sa propre complaisance.
#
# Champs :
#   id              - identifiant stable
#   label           - colonne Label de la feuille, verbatim
#   syntaxe_feuille - colonne Syntax, normalisée aux conventions du dépôt
#                     (♦ et [Enter] -> Enter ; espaces au lieu des crochets).
#                     `null` = cellule perdue à l'export du tableur.
#   mode            - colonne Mode (Foreground/Background), quand renseignée
#   auteur          - colonne Creator, quand renseignée
#   demande_nl      - la phrase française donnée au traducteur
#   cause           - POUR LES ENTRÉES hors_perimetre SEULEMENT : pourquoi le
#                     traducteur ne couvre pas, écrit À LA MAIN en regard de
#                     `syntaxe_feuille`. Ne JAMAIS le déduire du message de
#                     refus : un refus dit ce que le traducteur a remarqué en
#                     premier, pas ce qui bloque (`Chan 1 At 75 Check` se
#                     plaint d'un niveau manquant alors qu'il lui manque
#                     `Check`). Le banc échoue si une entrée hors périmètre
#                     n'en a pas. Valeurs admises : action_absente,
#                     forme_absente, navigation_relative, mecanisme_absent,
#                     macro_non_terminee, hors_ligne_de_commande,
#                     source_douteuse, selection_implicite,
#                     sens_non_atteste (la feuille suggère un sens qu'aucune
#                     source ne confirme — refuser vaut mieux que rendre une
#                     commande valide qui fait autre chose).
#   cause_detail    - la justification, en clair, de la valeur ci-dessus
#   verdict         - référence enregistrée, recalculée à chaque exécution :
#                     "identique"      même commande, aux espaces près
#                     "equivalent"     forme différente, les deux attestées
#                     "divergent"      désaccord réel -> question au journal
#                     "hors_perimetre" le traducteur ne couvre pas encore
#                     "source_fautive" la feuille est démontrablement fausse
#                     "illisible"      cellule perdue, rien à comparer
#   pourquoi        - obligatoire dès que le verdict n'est pas "identique"

meta:
  version: "0.1"
  entrees: 43
  exploitables: 37
  source: >-
    Feuille collaborative « Handy Macros », communauté ETC Eos, transmise en
    conversation le 2026-09-08. En-tête : « Feel free to add things and give
    some background info as to why this is a handy macro for you. »
  convention_feuille: >-
    Touches de face avant entre [crochets], softkeys entre {accolades},
    frappes simultanées avec « + ».
  correction_du_losange: >-
    CORRIGÉ le 2026-09-09. Cette note affirmait que le ♦ était « la convention
    DE LA FEUILLE pour [Enter] : zéro occurrence dans les 13 manuels ». Faux,
    et faux d'une façon que le dépôt interdit explicitement : une capture de
    l'éditeur de macro d'une console réelle montre le ♦ dans la colonne
    « Macro Contents » — c'est EOS lui-même qui affiche Enter comme ça, pas la
    feuille. Le ♦♦ y marque deux Enter consécutifs. L'absence dans les
    manuels convertis ne prouvait rien : un glyphe se perd à la conversion
    PDF -> Markdown. REGLES_POUR_UI.md règle 6 le dit — une absence ne se
    prouve pas par une citation — et je l'ai enfreinte en l'écrivant.
    La transcription ci-dessous garde `Enter` en toutes lettres, ce qui reste
    juste : c'est la même touche, écrite autrement.

