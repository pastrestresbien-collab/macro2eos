      - "traducteur/test_corpus_terrain.py — ancien `cause_de()`, supprimé"
    confiance: "A"
    consequence: "outillage"
    detail: >-
      Trois contre-exemples suffisent. `channel_check` = `Chan 1 At 75 Check
      Enter` nomme explicitement sa cible et se plaint d'un niveau manquant :
      il lui manque `Check`. `address_check` = `Address 1 At 75 Check` idem.
      `color_xfd_50` = `Color_Crossfade 50 Enter` ne nomme aucune cible.
      (CORRIGÉ le 2026-09-17 : j'avais écrit ici « réglage GLOBAL de console,
      qui ne prend aucune sélection ». C'était une supposition, et elle est
      probablement fausse — tout indique un PARAMÈTRE de projecteur, donc
      appliqué à la sélection courante comme Pan ou Hue. Voir l'entrée du
