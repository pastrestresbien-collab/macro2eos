      terminées, concept DÉJÀ modélisé.

      Le coût réel n'est pas l'erreur de comptage : c'est qu'elle avait fait
      inscrire au planning du jour, en priorité numéro un, un arbitrage
      produit sur la sélection implicite — présenté à l'utilisateur comme « le
      plus gros gisement, 11 entrées sur 23 » — qui ne débloquait AUCUNE
      entrée. Un indicateur dérivé, non vérifié, a orienté une décision de
      priorisation pendant six jours.

      Correctif structurel plutôt que ponctuel : la cause est désormais un
      champ `cause:` + `cause_detail:` écrit à la main dans le corpus, en
      regard de `syntaxe_feuille` et jamais d'après le refus ; huit valeurs
      admises ; et une entrée hors périmètre SANS cause fait échouer le banc
      (vérifié : code 1). La sélection implicite reste une question de
      conception légitime, mais elle sort du chemin critique — elle sera
      tranchée quand un usage réel la réclamera, pas pour faire monter un
