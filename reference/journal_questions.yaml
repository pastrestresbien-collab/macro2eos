  - date: "2026-09-17"
    question: >-
      Qu'est-ce que le `Color_Crossfade` de la feuille communautaire, absent
      du manuel comme des 1155 touches OSC ?
    reponse: >-
      Très probablement un PARAMÈTRE de projecteur, pas une touche ni un
      réglage global de console. Trois indices concordants, aucune preuve —
      l'inférence est donc de confiance C, alors que la SYNTAXE elle-même est
      de confiance B (la feuille).
    sources:
      - "corpus/handy_macros_etc.yaml — color_xfd_0/50/100, auteur « Sassy Squatch »"
      - "reference/eosKeys.ts — `Color_Crossfade` absent des 1155 touches ; `color_scrub`→COLOR_SCRUB présent"
      - "manuals/operations-manual/31-show-control.md:4448 — color_scrub, sans syntaxe ni exemple"
      - "manuals/virtual-media-server-workbook — `{Crossfade} [100] [Enter]`, AUTRE chose"
      - "communauté ETC (recherche web 2026-09-17) — paramètre de crossfade sur Arri SkyPanel, Astera Titan Tube, Digital Sputnik"
    confiance: "B"
    consequence: "modele_complete"
    detail: >-
      Les trois indices. (1) Son absence d'eosKeys ne prouve rien contre lui :
      Hue et Saturation en sont absents pour la même raison, ce sont des
      PARAMÈTRES (`/eos/param/`) et non des touches (`/eos/key/`) — déjà
      consigné à l'entrée sur la recette de palettes. (2) La communauté ETC
      décrit un paramètre de crossfade sur des projecteurs LED de cinéma, qui
      mélange entre mode RGB et mode calibré. (3) La syntaxe `<mot> <valeur>
      Enter` est celle d'un paramètre.

      CE QUE J'AVAIS ÉCRIT DE FAUX, et qui est corrigé : le 2026-09-14, en
      qualifiant les causes du corpus, j'ai écrit que c'était « un réglage
      GLOBAL de console, qui ne prend aucune sélection ». C'était une
      supposition présentée comme un constat, tirée du seul fait que la macro
      ne nomme pas de cible — or une macro de bouton ne nomme jamais sa cible,
      elle agit sur la sélection courante. La note du corpus est corrigée.

      NE PAS CONFONDRE avec le `{Crossfade}` du serveur média virtuel, qui
      règle une priorité entre canaux serveur et canaux console. Même mot,
      autre fonction, et le VMS est hors périmètre du projet.

      À TRANCHER AU BANC, deux questions distinctes : (a) le nom exact
      qu'affiche la console — `Color_Crossfade` n'est peut-être qu'un libellé
