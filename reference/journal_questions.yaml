# Journal des questions posées au corpus — troisième journal du projet, à
# côté de grammar/refus_terrain.yaml et traducteur/observations_llm.yaml.
#
# Les trois capturent des choses de nature différente, et les confondre ferait
# perdre l'information la plus utile de chacun :
#
#   refus_terrain.yaml      constat au BANC réel (confiance S) — ce que la
#                           console accepte ou refuse vraiment.
#   observations_llm.yaml   trou de VOCABULAIRE côté moteur flou — un mot que
#                           le lexique fermé ne connaissait pas.
#   journal_questions.yaml  (ce fichier) trouvaille DOCUMENTAIRE — ce que le
#                           manuel dit, et ce que le dépôt en fait ou n'en
#                           fait pas encore.
#
# Pourquoi ce fichier existe
# ---------------------------
# Les questions posées en session (« comment marche l'arrière-plan d'une cue
# list ? », « quelle commande pour éteindre les écrans ? ») produisent à chaque
# fois une réponse sourcée qui a coûté une recherche dans 37 Mo de manuels —
# et qui repartait jusqu'ici en fumée avec la conversation. Or ces réponses
# révèlent régulièrement un écart : le manuel documente quelque chose que le
# modèle ne connaît pas, ou une absence que le projet ferait bien d'acter.
# C'est ce delta qu'on conserve ici, pas la réponse elle-même.
#
# Ce n'est PAS une base de connaissances. Le manuel reste la source ; ce
# fichier ne recopie que ce qu'il faut pour retrouver le passage et décider
# quoi en faire.
#
# Alimentation : manuelle, en fin d'échange (voir PROMPT_QUESTIONS.md à la
# racine). Aucune écriture automatique, aucune promotion automatique — même
# discipline que les deux autres journaux.
#
# Champs :
#   date        - AAAA-MM-JJ
#   question    - la question posée, en français, verbatim si possible
#   reponse     - la réponse en une ou deux phrases, pas le développement
#   sources     - liste de "fichier §section" réellement consultés et cités.
#                 Une réponse sans source vérifiée n'entre pas dans ce fichier.
#   confiance   - S/A/B/C/D (échelle du projet, voir SOURCES.md) ou "absence"
#                 pour un fait négatif (« X n'existe pas »), qui ne se prouve
#                 jamais par une citation — voir REGLES_POUR_UI.md règle 6.
#   consequence - ce que ça implique pour le dépôt. C'est le champ qui compte :
#                 "aucune"                 la réponse n'a pas d'impact projet
#                 "modele_manquant"        le manuel documente, modele.yaml ignore
#                 "lexique_manquant"       traduisible en principe, pas au lexique
#                 "absence_confirmee"      à ne jamais tenter de générer
#                 "contradiction"          le dépôt dit autre chose que le manuel
#                 "doc_a_ecrire"           utile, à consigner dans un .md du dépôt
#                 "tuto_absent"            sujet cherché, aucun des 13 documents ne
#                                          le couvre — un trou du fonds, pas du modèle
#   backlog     - numéro(s) PLANNING.md concerné(s), ou null
#   traite      - "non" | "oui" | "rejete" — jamais mis à "oui" par du code.
#                 Passe à "oui" quand la conséquence a été portée dans le
#                 dépôt (entrée de modele.yaml, de lexique.yaml, ligne de
#                 PLANNING.md...), avec la référence dans `traite_ou`.
#   traite_ou   - où la conséquence a atterri, ou null

meta:
  version: "0.1"
  maj: "2026-09-08"

questions:
  - date: "2026-09-03"
    question: "Explique la notion d'arrière-plan dans les paramètres des cue lists."
    reponse: >-
      Background est une propriété de cue list réglée au niveau du fader :
      activée, le contenu de la liste sert d'état d'arrière-plan pour les
      autres cues et submasters. Background Priority (10 niveaux, 4 par
      défaut) décide sur quoi on retombe quand du contenu est relâché — la
      priorité la plus haute qui avait la main, et non plus le dernier fader
      propriétaire comme dans les versions antérieures.
    sources:
      - "manuals/operations-manual/12-cues-the-cue-list.md §Cue List Properties, §Background"
      - "reference/eosKeys.ts — background/BACKGROUND_FADER, distinct de background_mode/MACRO_BACKGROUND"
    confiance: "A"
    consequence: "modele_manquant"
    detail: >-
      grammar/modele.yaml ne connaît `Background` que comme mode de MACRO
      (MACRO_BACKGROUND). Les propriétés de cue list (Background, Background
      Priority, Phantom, Back From First, Go From Last, Stomp, Exclude) n'y
      sont pas modélisées du tout. Le manuel ne donne d'exemple de ligne de
      commande que pour Priority (`[Cue] [1] [/] {Priority} [5] [Enter]`) —
      la syntaxe des autres reste à établir avant toute modélisation.
    backlog: null
    traite: "non"
    traite_ou: null

  - date: "2026-09-03"
    question: "Quelle commande écrire dans l'éditeur de macro pour éteindre les affichages ?"
    reponse: >-
      La fonction s'appelle Extinguish (Setup > Device > Brightness Settings,
      ou maintenir [Displays]) : elle met toutes les luminosités à 0 % et
      éteint écrans et touches, sauf le bouton d'alimentation. Mais c'est un
      bouton de fenêtre de réglages, pas une touche ni une softkey — donc
      a priori pas insérable dans une macro.
    sources:
      - "manuals/operations-manual/05-setup.md §Brightness Settings, §Extinguish"
      - "manuals/l1-essentials-workbook/Eos_Family_L1_Essentials_v3.3.md §EXTINGUISH"
      - "manuals/operations-manual/24-macros.md §Macro Softkeys"
      - "reference/eosKeys.ts — aucune occurrence d'extinguish/backlight/brightness sur 1155 entrées"
    confiance: "absence"
    consequence: "absence_confirmee"
    detail: >-
      Absence NON confirmée au banc : deux indices convergents seulement
      (rien dans eosKeys.ts, rien dans les softkeys de macro du §24). Se
      tromper sur une absence est plus grave que sur une syntaxe
      (REGLES_POUR_UI.md règle 6) — à trancher sur console via l'outil que
      le manuel documente lui-même : éditeur de macro > {Edit} > bouton de
      recherche, qui liste TOUTES les commandes de macro. Si la liste est
      vide sur "ext"/"bright"/"display", l'absence devient S et peut entrer
      au modèle comme zone interdite.
    backlog: null
    traite: "non"
    traite_ou: null

  - date: "2026-09-03"
    question: "Comment faire le focus à la souris d'un projecteur traditionnel dans Augment3d ?"
    reponse: >-
      Impossible par click-to-focus ou poignée de focus : le manuel est
      explicite, les poignées sphériques refocalisent les asservis, les
      poignées cubiques signalent un conventionnel et ne peuvent PAS servir à
      refocaliser. On tourne l'objet (Rotate Tool, Local Tool, Pivot, Snap
      Angle) et on se repère avec Stick Beams, qui trace la ligne jusqu'au
      point d'impact sans exiger d'intensité.
    sources:
      - "manuals/operations-manual/26-augment3d.md §Focus Handles, §Rotate Tool, §Local Tool, §Sticks Tool"
      - "manuals/augment3d-workbook/Eos_Family_Intro_to_Augment3d_v3.0.md §Click to Focus"
    confiance: "A"
    consequence: "aucune"
    detail: >-
      Augment3d est hors du périmètre de l'app (aucune de ces actions ne
      passe par la ligne de commande ni par OSC). Consigné pour ne pas
      refaire la recherche, pas pour être modélisé.
    backlog: null
    traite: "non"
    traite_ou: null

  - date: "2026-09-08"
    question: "Analyse la qualité de trois corpus de macros fournis en conversation."
    reponse: >-
      Trois documents, trois natures. Les lots « 100 macros » (1-60 puis
      61-100) sont inutilisables comme source de syntaxe : 16 noms de commande
      sans aucune trace dans les 1155 clés OSC ni dans les manuels pour le
      premier, une douzaine pour le second. La feuille communautaire ETC
      « Handy Macros » (43 entrées, colonnes Mode et Creator) tient au
      contraire la vérification : la quasi-totalité de son vocabulaire résout,
      et quatre de ses entrées recoupent mot pour mot des passages du dépôt.
    sources:
      - "reference/eosKeys.ts — 1155 clés"
      - "manuals/operations-manual/02-system-basics.md:2328 — `[Copy To] [Copy to]` pose Move To"
      - "manuals/l3-advanced-workbook §Fan — `[Fan] {Center} [Enter]` (l.1006, 1123)"
      - "manuals/operations-manual/09-mark.md:166 — {Earliest M}"
      - "manuals/operations-manual/15-advanced-manual-control.md:311-313 — Query Live Moves / Dark Moves"
      - "manuals/operations-manual/04-patch.md:288 — [Query] {Unpatched}, et non {Unused}"
      - "manuals/operations-manual/24-macros.md:141-167 — softkeys de l'éditeur de macro"
      - "corpus/CORPUS_EOS_COMPLET.md #035 — More_SoftKeys ne s'enregistre pas en macro"
    confiance: "A"
    consequence: "contradiction"
    detail: >-
      Trois défauts systémiques communs aux deux premiers lots. (1) Confusion
      entre la liste des clés OSC et le vocabulaire de l'éditeur de macro —
      `macro_wait` est un nom OSC, le softkey s'appelle `{Wait}` (§24). (2)
      Confusion `[touche]` / `{softkey}` : le manuel précise QUELS modèles de
      console exigent la forme softkey (`{Fader Control} {Off}` sur Element 2,
      `[Fader Control] {Freeze}` sur Ion Classic — 20-submasters.md:419, 457),
      contrainte absente des deux lots. (3) Échelle de confiance incompatible :
      les lots cotent 4/5 et 5/5 des macros d'origine forum, alors qu'aucune
      entrée d'origine forum du dépôt ne dépasse B (voir la table « Liste
      vivante » du corpus). Signal négatif décisif sur la provenance
      revendiquée : six des tokens les plus distinctifs du second lot (Freeze,
      Stomp, Fader Page, Unused, Unlock, Clear Tabs) ont zéro occurrence dans
      les 174 entrées du corpus, pourtant récoltées sur les mêmes forums.
      La feuille « Handy Macros » a le défaut inverse — dégâts d'export de
      tableur : 6 entrées sur 43 ont perdu leur syntaxe (« 3 », « 300t3 »,
      « Q », deux cellules vides, un `805` orphelin), et une est déclarée
      cassée par son propre auteur. Défaut de complétude, pas d'invention.
      Retenu du lot 2 malgré tout : `clear_all_tabs` EXISTE bien comme clé OSC
      — son `{Clear Tabs}` visait une fonction réelle avec un token faux.
    backlog: null
    traite: "oui"
    traite_ou: >-
      Tranche « conduite » (durées, Check, Go To Cue temporisé) tirée des
      intentions de la feuille communautaire, syntaxe reprise au manuel seul.

  - date: "2026-09-08"
    question: "Un submaster accepte-t-il `At <niveau>` ? Le modèle le refuse, le manuel en donne un exemple."
    reponse: >-
      Contradiction ouverte. grammar/modele.yaml refuse `Sub` + `intensite`
      avec la confiance S (constat au banc : le niveau d'un sub passe par le
      fader ou les bumps). Or le manuel §6 donne `[Sub] [4] [At] [5] [0]
      [Sneak] [2] [Enter]` — « selects submaster 4 and sneaks it to 50% in 2
      seconds ». Réconciliation plausible mais NON vérifiée : `At` seul
      échouerait là où `At <n> Sneak <s>` réussirait, le Sneak étant ce qui
      exécute le mouvement.
    sources:
      - "manuals/operations-manual/06-manual-control.md:1122"
      - "grammar/modele.yaml — legalite, Sub + intensite, valide: non, confiance S"
    confiance: "A"
    consequence: "contradiction"
    detail: >-
      Le refus reste EN PLACE : une observation au banc (S) prime sur une
      ligne de manuel (A), c'est la hiérarchie du projet. À trancher au banc,
      en testant séparément `Sub 4 At 50 Enter` et `Sub 4 At 50 Sneak 2
      Enter`. Si le second passe, la règle de légalité doit se resserrer sur
      la forme nue au lieu de refuser le couple entier.

      TRANCHÉ 2026-09-13 : les DEUX formes passent au banc réel. Ce n'est donc
      pas la forme nue qui était en cause — c'est le constat S d'origine qui
      était une sur-interprétation (« je pilote mes subs au fader » n'est pas
      « At est refusé »). Le manuel (A) avait raison contre le banc (S) parce
      que le banc n'avait jamais testé la commande, seulement l'habitude.
      Précédent à retenir : vérifier qu'une confiance S porte bien sur une
      OBSERVATION et non sur une pratique.
    backlog: null
    traite: "oui"
    traite_ou: "grammar/modele.yaml legalite Sub+intensite (valide: oui, S)"

  - date: "2026-09-08"
    question: "`Go To Cue <n> Time Enter` ignore-t-il les temps de la cue ?"
    reponse: >-
      Non, l'inverse. Le manuel §16 : « `[Go To Cue] [8] [Time] [Enter]` would
      take you to cue 8 using all timing values stored in cue 8 ». Ce qui
      ignore la temporisation, c'est `Time 0`. La macro « Quickstep » de la
      feuille communautaire écrit `[go to cue] [next] [time] [enter]` en
      annonçant « jumps to next cue but ignores timing » : sa syntaxe fait
      l'inverse de sa description.
    sources:
      - "manuals/operations-manual/16-cue-playback.md:133-141"
      - "grammar/patrons.yaml — patron noir sec, `Go To Cue Out Time 0 Enter`, confiance A"
    confiance: "A"
    consequence: "lexique_manquant"
    detail: >-
      Cas d'école : une macro largement diffusée, plausible, écrite par un
      praticien, et fausse sur le point précis qu'elle revendique. Seule la
      lecture du manuel la départage. Le traducteur produit désormais `Time 0`
      pour « sans les temps » et `Time <n>` pour « en n secondes », jamais un
      `Time` nu.
    backlog: null
    traite: "oui"
    traite_ou: "traducteur/traducteur.py — _sans_temps() et _temps_de_cue()"

  - date: "2026-09-08"
    question: "Le traducteur sait-il produire ce que les praticiens écrivent vraiment ?"
    reponse: >-
      Non : 0 sur 26 entrées comparables de la feuille communautaire ETC.
      Mesurée contre le modèle du dépôt, la couverture est de 30 intentions
      pour 80 actions ; mesurée contre un corpus de terrain, elle est nulle.
      La répartition des échecs importe plus que le total — 9 macros
      multi-commandes (fonctionnalité absente), 17 trous de vocabulaire, et
      9 échecs par SÉLECTION IMPLICITE.

      CORRIGÉ 2026-09-14 : le dernier chiffre est FAUX, et le suivi l'a porté
      à 11 avant qu'on le vérifie. Il venait d'un classement automatique du
      banc, qui cherchait « aucun numéro » dans le message de refus. Une
      qualification à la main des 23 entrées hors périmètre donne ZÉRO
      sélection implicite : les entrées ainsi rangées nomment leur cible
      (`Chan 1 At 75 Check`), ou visent un réglage global sans sélection
      (`Color_Crossfade 50`), ou demandent la navigation Next/Last. La cause
      est désormais déclarée entrée par entrée dans le corpus.
    sources:
      - "corpus/handy_macros_etc.yaml — 43 entrées, 37 exploitables"
      - "traducteur/test_corpus_terrain.py — banc de rétro-traduction"
      - "REGLES_POUR_UI.md règle 5 — ne jamais deviner un état de console"
    confiance: "A"
    consequence: "contradiction"
    detail: >-
      Tension de conception, pas trou de lexique. Les macros de praticiens
      sont écrites pour « ce qui est sélectionné en ce moment » — c'est
      l'intérêt même d'un bouton de magic sheet : `@ Full Sneak Time 20` ne
      nomme aucun circuit. Le traducteur exige au contraire une cible
      explicite dans la phrase, par la règle 5. Les deux positions sont
      défendables et elles s'excluent. Trois issues possibles, aucune
      tranchée : (a) tenir la règle 5 et assumer de ne pas couvrir cette
      famille ; (b) introduire une sélection courante EXPLICITE dans l'IR,
      que l'utilisateur pose en une phrase séparée, ce qui garde la règle 5
      au niveau de la phrase tout en couvrant l'usage ; (c) un mode « macro »
      distinct du mode « ligne de commande ». Décision utilisateur, pas
      technique — elle change ce qu'est le produit.
    backlog: null
    traite: "non"
    traite_ou: null

  - date: "2026-09-09"
    question: "Le mot-clé `Time` est-il obligatoire après `Sneak` ?"
    reponse: >-
      Non, il est OPTIONNEL. `Sneak 3` et `Sneak Time 3` sont la même
      commande. Le manuel §6 écrit `[Sneak] <Time> [3] [Enter]`, et sa propre
      convention de notation le dit : « Optional keys which don't have to be
      pressed are indicated in <angle brackets> ».
    sources:
      - "manuals/operations-manual/00-welcome-introduction.md:339 — convention de notation"
      - "manuals/operations-manual/06-manual-control.md:1108-1122 — exemples de Sneak"
      - "manuals/operations-manual/06-manual-control.md:314, 852 — `[1] [Full]` et `[At] [Full]`"
    confiance: "A"
    consequence: "contradiction"
    detail: >-
      CORRIGE une entrée de la veille. Le 2026-09-08 j'ai écrit dans
      grammar/modele.yaml que les deux formes de temps du sneak « ne se
      déduisent pas l'une de l'autre », et j'ai reproché à la feuille
      communautaire son `@ Full Sneak Time 20`. C'était une erreur de lecture :
      la convention <angle brackets> n'avait pas été consultée. La feuille
      avait raison. Même convention pour `[5] [At] [5]<0>`, où le zéro final
      est implicite. Conséquence outillage : le banc de rétro-traduction
      connaît désormais deux tokens optionnels prouvés (`Time` après `Sneak`,
      `At` devant un niveau) et classe ces cas en `equivalent` plutôt qu'en
      désaccord. La liste est volontairement courte — l'élargir au jugé ferait
      passer de vrais désaccords pour des équivalences et viderait le banc de
      son intérêt.
    backlog: null
    traite: "oui"
    traite_ou: "grammar/modele.yaml actions/sneak/temps_du_sneak ; traducteur/test_corpus_terrain.py OPTIONNELS"

  - date: "2026-09-09"
    question: "Assouplir la règle 5 pour couvrir les macros sans cible nommée : à quel prix ?"
    reponse: >-
      Le prix est de trois verrous, et l'assouplissement n'a rien coûté en
      syntaxe : le modèle déclarait déjà `selection_courante` valide pour
      `intensite`, `plein_feu`, `hors_scene` et `sneak`, en confiance A, et le
      générateur les rendait sans un seul avertissement. Seul le traducteur
      refusait.
    sources:
      - "grammar/modele.yaml — legalite, objet: selection_courante, valide: oui, confiance A"
      - "manuals/operations-manual/15-advanced-manual-control.md — une sélection déjà posée accepte `At`"
      - "REGLES_POUR_UI.md règle 4 et règle 5"
    confiance: "A"
    consequence: "doc_a_ecrire"
    detail: >-
      Les trois verrous, chacun né d'un cas réel et non d'une précaution
      théorique. (1) Un objet nommé SANS numéro reste une phrase incomplète :
      sinon un numéro perdu à la frappe devient un ordre sur une sélection
      inconnue. (2) Un mot de CIBLE (Sub, Preset) interdit le repli — trouvé
      par régression le jour même : « sub 3 à 50 % » rendait `At 50 Enter`,
      soit un ordre sur des circuits quelconques, alors que le banc a tranché
      Sub + At invalide en confiance S. (3) Un seul mot inconnu interdit le
      repli — trouvé au banc de rétro-traduction : « passe le fondu de couleur
      à fond » rendait `Full Enter`, envoyant tout le plateau à pleine
      intensité pour une demande qui ne parlait que de fondu de couleur. Le
      verrou 3 remplace exprès le filet que le mot d'objet obligatoire
      fournissait par accident.
    backlog: null
    traite: "oui"
    traite_ou: "traducteur/traducteur.py — _vise_la_selection_courante(), _selection_courante_permise()"

  - date: "2026-09-09"
    question: >-
      Renommer à la volée des cues d'après les palettes dont elles viennent —
      la réponse de la communauté « (Focus/color etc) Palette x thru x copy to
      cue x/x soft key {label only} » tient-elle ?
    reponse: >-
      Oui sur le mécanisme, avec une correction d'orthographe et un piège
      omis. Le manuel §15 est explicite et GÉNÉRAL : « The [Copy To] and Move
      To commands can be used to copy or move labels between any target types
      that can have labels. A {Labels Only} softkey will display. » C'est ce
      qui autorise palette -> cue, alors qu'aucun exemple chiffré ne montre ce
      couple précis.
    sources:
      - "manuals/operations-manual/15-advanced-manual-control.md:93, 97"
      - "manuals/operations-manual/20-submasters.md:453 — `[Sub] [2] [Copy To] [Sub 9] {Labels Only} [Enter][Enter]`"
      - "manuals/operations-manual/10-palettes.md:379, 413"
      - "reference/eosKeys.ts — only_labels -> ONLY_LABELS"
    confiance: "A"
    consequence: "modele_manquant"
    detail: >-
      Trois écarts avec la réponse reçue. (1) ORTHOGRAPHE : le softkey est
      `{Labels Only}` au PLURIEL — 4 occurrences dans les manuels, clé OSC
      `only_labels`. La forme singulière `{Label Only}` n'existe nulle part.
      (2) PIÈGE OMIS, et c'est le point important : écraser une cible
      existante demande une confirmation, donc un SECOND `Enter` — « The
      second [Enter] is not required if you have disabled confirmations in
      setup » (§10 l. 413). Une macro dépend ici d'un réglage de Setup
      invisible dans son texte : écrite avec un seul `Enter` elle reste en
      attente sur une console où les confirmations sont actives ; écrite avec
      deux, le second valide la ligne suivante là où elles ne le sont pas.
      Même famille que le piège `Q Only`/`Track`. Non tranché, à porter au
      banc. (3) La borne haute de la destination ne se donne jamais (§10
      l. 379). Lacune du dépôt révélée au passage : `Copy To` — un des verbes
      majeurs d'Eos — était ABSENT du modèle, qui ne connaissait que
      `Recall From`. Ajouté avec cinq modificateurs de la famille `... Only`.
    backlog: null
    traite: "oui"
    traite_ou: "grammar/modele.yaml actions/copier_vers + modificateurs ; traducteur intention copier_libelles"

  - date: "2026-09-09"
    question: >-
      Pourquoi un `Sneak` nu en fin de macro ne rend-il pas la main aux
      circuits ?
    reponse: >-
      Parce qu'en mode Background la macro ne s'exécute pas dans le contexte
      de l'opérateur. Le manuel §24 : « A macro in background mode that is run
      from a cue or via show control will run on the MASTER DEVICE but will
      not affect the master's command line. » La « sélection en cours » qu'un
      `Sneak Enter` nu vise est donc celle de cet appareil-là. Le remède est
      de poser la sélection dans la macro — `Select_Manual`, `Select_Active`
      ou `Select_Last`.
    sources:
      - "manuals/operations-manual/24-macros.md:97-111 — les trois modes"
      - "manuals/operations-manual/06-manual-control.md:1194-1204 — Select Manual"
      - "reference/eosKeys.ts — foreground_mode -> MACRO_USER, select_manual -> SELECT_MANUAL"
      - "corpus/CORPUS_EOS_COMPLET.md l. 290, 294, 384 — « Foreground par défaut »"
    confiance: "A"
    consequence: "modele_manquant"
    detail: >-
      Diagnostic apporté par la communauté sur une macro « PRESET SUB OFF » se
      terminant par `Clear_CmdLine Sneak`. Il donne son motif le plus clair à
      une règle que le corpus avait déjà retenue pour d'autres raisons
      (« Foreground par défaut »), et il QUALIFIE directement l'assouplissement
      de la veille : le traducteur produit désormais des commandes sans cible
      nommée, et sa note disait « vérifier ce qui est sélectionné » — comme si
      le risque était l'inattention. Il est plus grave : en Background la
