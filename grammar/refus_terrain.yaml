# Refus terrain — journal des rejets réels observés sur console/nomad.
#
# Chaque refus de la console est une preuve de niveau S (banc réel, la plus haute
# confiance du projet) — voir APP.md « La console fait autorité ». Ce fichier les
# accumule au lieu de les jeter : ils alimentent directement les cases `inconnu`
# de la matrice de légalité (`modele.yaml`) et le backlog (`PLANNING.md`).
#
# Alimentation : manuelle pour l'instant (retour verbal → ajouté ici en session).
# Le jour où l'app existe, elle pourra journaliser ses refus dans le même format
# pour import automatique.
#
# Champs :
#   date            - AAAA-MM-JJ
#   demande_nl      - ce que l'utilisateur a demandé en langage naturel
#   commande        - la macro générée et envoyée
#   erreur_console  - message de refus renvoyé par Eos (verbatim si possible)
#   diagnostic      - analyse : pourquoi refusée, ce que ça tranche
#   backlog         - numéro(s) PLANNING.md concerné(s), si applicable
#   tranche         - "oui" | "non" | "partiel" : le refus résout-il une case inconnue ?

meta:
  version: "0.1"
  maj: "2026-08-02"

refus:
  - date: 2026-09-18
    demande_nl: "vérifier si Cue 0.5 - Select Active fonctionne sans le préfixe Group"
    commande: "Cue 0.5 - [Ctrl+A] (touche Select Active, cf. manuals/hotkeys/EosFamily_v3.0.0_Hotkeys.md:159)"
    erreur_console: "Erreur : Numéro impossible"
    diagnostic: >
      Cue 0.5 existe bien sur ce show (contrairement au test précédent
      annulé avec Cue 7 inexistante), donc ce refus est exploitable. Après
      `Cue 0.5 -`, la console attend un nombre (probablement pour une
      soustraction de plage de cues) et rejette la touche Select Active à
      cet endroit avec "Numéro impossible". Confirme que `Cue {n} - Select
      Active` SANS le préfixe `Group` est invalide — le patron
      `selection_channels_fcb_dans_cue` (grammar/patrons.yaml) nécessite
      bien `Group` avant `Cue`. Ne tranche toujours pas CE QUE `Group`
      apporte exactement (objet Group de modele.yaml vs mécanisme propre à
      la sélection de cue).
    backlog: []
    tranche: "oui"
  # Exemple de forme attendue (à dupliquer, jamais laissé actif) :
  # - date: 2026-08-15
