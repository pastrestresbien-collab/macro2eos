# Modèle Eos — objets, actions, matrice de légalité
#
# Source de vérité pour la construction de commandes. Écrit à la main, relisible.
# Compilé en JSON par `grammar/build.py` pour consommation par le code.
#
# Périmètre v0.3 :
#   v0.1  sélection channels/groupes + couleur de nuancier + record de palette
#   v0.2  + Fan (§4 de la grammaire consolidée) + cues + macros + submasters
#   v0.3  + Query + effets + couche d'injection OSC
#   v0.4  + contexte d'écran (modalité) + auto-terminaison
#   v0.5  + Patch (§4) — où `At` s'inverse une seconde fois
#
# Champ `confiance` : S (banc réel) > A (manuel officiel) > B (ETC forum) >
#                     C (communauté, non testé) > D (signal négatif).
# Champ `valide: inconnu` = jamais tranché. Le générateur DOIT avertir, jamais
# injecter en aveugle. `backlog` renvoie au numéro dans PLANNING.md.

meta:
  version: "0.5"
  perimetre: >
    selection + couleur + record palette + fan + cues + macros + submasters
    + query + effets + injection OSC + contexte d'écran + patch
  maj: "2026-08-02"

# --------------------------------------------------------------------------
# CONTEXTE D'ÉCRAN — la modalité, préalable à tout le reste
#
# La ligne de commande Eos est modale : le MÊME mot ne veut pas dire la même
# chose selon l'écran actif. C'est la raison pour laquelle ce projet a écarté
# une grammaire formelle (voir README) — une EBNF ne peut pas exprimer qu'un
# token dépend d'un état extérieur à la phrase.
# --------------------------------------------------------------------------
contexte:
  confiance: A
  source: "manuel §2 System Basics ; corpus #167-168 (Operations Manual, A)"

  focus:
    regle: "`Tab <n> Enter` amène le focus sur l'écran n"
    confiance: A
    source: "corpus #168, réponse officielle"
    doctrine: >
      Le focus visuel et le focus logique sont le MÊME mécanisme — « draw
      focus » dans le vocabulaire du manuel. Rien n'indique qu'il existe un
      préfixe de commande qui changerait le contexte sans changer l'affichage.
      Conséquence directe : pour générer une commande dépendante du contexte,
      il faut forcer le Tab, et cela déplace ce que voit l'opérateur.
    raccourci_liste:
      regle: "double appui sur la touche d'un record target ouvre sa liste"
      exemple: "`Cue Cue` ouvre l'index de cue list ; `Macro Macro` l'éditeur de macros"
      confiance: A
      source: "corpus #169"

  # Table officielle Tab → Display (corpus #168, la plus complète du corpus)
  ecrans:
    1:  { nom: "Live/Blind",          confiance: A }
    2:  { nom: "Playback Status",     confiance: A }
    3:  { nom: "Magic Sheet",         confiance: A }
    4:  { nom: "Direct Selects",      confiance: A }
    5:  { nom: "ML Controls",         confiance: A }
    6:  { nom: "Effect Status",       confiance: A }
    7:  { nom: "Keys",                confiance: A }
    8:  { nom: "Effect Channels",     confiance: A }
    9:  { nom: "Pixel Maps",          confiance: A }
    10: { nom: "Pixel Preview",       confiance: A }
    11: { nom: "Show Control",        confiance: A }
    12: { nom: "Patch",               confiance: A }
    13: { nom: "Effects",             confiance: A }
    14: { nom: "Magic Sheet List",    confiance: A }
    15: { nom: "Submaster List",      confiance: A }
    16: { nom: "Cue List",            confiance: A }
    17: { nom: "Groups",              confiance: A }
    18: { nom: "Macros",              confiance: A }
    19: { nom: "Snapshots",           confiance: A }
    20: { nom: "Park",                confiance: A }
    21: { nom: "Curves",              confiance: A }
    22: { nom: "Intensity Palettes",  confiance: A }
    23: { nom: "Focus Palettes",      confiance: A }
    24: { nom: "Color Palettes",      confiance: A }
    25: { nom: "Beam Palettes",       confiance: A }
    26: { nom: "Presets",             confiance: A }
    27: { nom: "Color Picker",        confiance: A }
    28: { nom: "Virtual Faders",      confiance: A }
    29: { nom: "About",               confiance: A }
    30: { nom: "Command History",     confiance: A }
    31: { nom: "Lamp Controls",       confiance: A }
    32: { nom: "Channels In Use",     confiance: A }
    33: { nom: "Color Path",          confiance: A }
    35: { nom: "Fader List",          confiance: A }
    36: { nom: "Fader Configuration", confiance: A }
    37: { nom: "sACN Output View",    confiance: A }
    99: { nom: "Diagnostics",         confiance: A }
    100: { nom: "User Manual",        confiance: A }

  # Dans Patch, `At` s'inverse une SECONDE fois — selon un mode interne à
  # l'écran, invisible dans la commande et non observable en OSC.
  modes_patch:
    confiance: A
    source: "manuel §4 « Patching By Channel » / « Patching By Address »"
    bascule:
      mot_cle: "Format"
      osc: format
      type: toggle
      confiance: A
      backlog: 20
      note: >
        `Format` bascule, il ne règle pas. Aucune adresse `/eos/out/…` ne
        publie le mode courant — le sous-arbre `/eos/out/get/patch/…` renvoie
        la base de patch, pas l'état de l'affichage. Le mode est donc à la fois
        non réglable et non lisible depuis OSC.
    par_channel:
      defaut: true
      sens: "`5 At 100` patche le CHANNEL 5 à l'ADRESSE 100"
      confiance: A
    par_adresse:
      defaut: false
      sens: "`5 At 100` patche l'ADRESSE 5 au CHANNEL 100 — exactement l'inverse"
      confiance: A
    consequence_generateur: >
      La même chaîne de caractères produit deux patchs opposés selon un état
      que le générateur ne peut ni lire ni régler de façon fiable. Seule
      parade documentée : le préfixe explicite `Address <n> At <channel>`, qui
      lève l'ambiguïté quel que soit le mode (manuel §4). Le générateur émet
      cette forme dès qu'il patche par adresse.

  # Les mots dont le sens dépend de l'écran actif
  polysemie:
    At:
      sens:
        Live:  "niveau d'intensité — `Chan 1 At 50` = 50 %"
        Blind: "niveau d'intensité"
        Patch: "adresse DMX de départ — `601 At 250` patche l'adresse 250"
      confiance: S
      source: >
        Découverte terrain (corpus #161-162, S), reconfirmée indépendamment par
        une source communautaire (corpus vague 33) et par le manuel §4.
      consequence_generateur: >
        Le générateur DOIT connaître son écran avant d'émettre `At`. Une
        commande d'intensité envoyée pendant que Patch a le focus repatche.
    "@":
      sens:
        Live:  "identique à At — niveau"
        Patch: "adresse"
      confiance: B
      source: "corpus vague 33, confirmation indépendante"
      note: "la polysémie ne se limite pas au mot `At` : le symbole la partage"
    "/":
      sens:
        cue:      "préfixe de cue list — `Cue 2/5`"
        temps:    "séparateur montée/descente — `Time 4/3`"
        pourcent: "pourcentage du temps de cue en timing discret — `Time /50`"
        dmx:      "valeur DMX brute en double — `Chan 1 At / / 239` met le channel 1 à 239"
        patch:    "séparateur univers/adresse — `603 At 2 / 146`"
      confiance: A
      source: "manuel §4, §6, §12"
      note: >
        Cinq sens documentés pour un seul symbole, tous distingués par la
        position et non par l'écran. À ne pas confondre avec la polysémie de
        `At`, qui elle dépend bien de l'écran.

# --------------------------------------------------------------------------
# PATCH EN MASSE — le Fan s'applique ici aussi, avec un pas non prévisible
# --------------------------------------------------------------------------
patch:
  confiance: A
  source: "manuel §4 « Range Patching » ; corpus #164 (A)"

  plage:
    forme: "`Chan <a> Thru <b> At <adresse>` patche la plage à partir de l'adresse"
    exemple: "`1 Thru 20 At 10` patche les channels 1 à 20 aux adresses 10 à 29"
    confiance: A
  liste:
    forme: "`<a> + <b> + <c> At <adresse>` attribue les adresses dans l'ordre de la liste"
    exemple: "`1 + 4 + 8 At 1` patche le channel 1 à l'adresse 1, le 4 à 2, le 8 à 3"
    confiance: A
    note: "les adresses se suivent, pas les channels"

  pas_non_previsible:
    regle: >
      Le pas d'adresse entre deux channels est l'empreinte DMX (footprint) du
      fixture, pas systématiquement +1.
    confiance: A
    source: "corpus #164, confirmation officielle"
    consequence_generateur: >
      Le générateur ne peut PAS annoncer les adresses résultantes sans
      connaître le type de fixture patché. Il ne doit donc jamais les afficher
      comme un fait dans une prévisualisation — seulement l'adresse de départ.

  plage_channels_seulement:
    regle: "`Thru` ne patche en plage QUE des channels"
    confiance: A
    source: 'manuel §4 : "Range patching only works with channels"'
    piege: >
      Tenter une plage d'ADRESSES ne produit pas d'erreur : Eos crée des PARTS
      sur le channel au lieu de patcher une plage. Le résultat est silencieux
      et faux.

  part_automatique:
    regle: >
      Patcher une adresse sur un channel déjà adressé crée une part
      supplémentaire au lieu de remplacer.
    confiance: A
    source: "manuel §4 « Creating Multipart and Compound Channels »"

  dimmer_doubling:
    softkeys: ["{A}", "{B}", "{NoDimDbl}"]
    confiance: A
    source: "manuel §4 « Dimmer Doubling »"
    note: >
      `{NoDimDbl}` ne s'emploie qu'en mode ADRESSE — il faut basculer avec
      `Format` d'abord. Décalage réseau par défaut de 20000 (256 sur Sensor
      Classic), réglable dans le Setup.

# --------------------------------------------------------------------------
# TERMINAISON — toutes les commandes ne prennent pas `Enter`
#
# Le manuel est explicite ET incomplet sur ce point : « There are some commands
# which are self-terminating […] Some (but not all) of these commands are: ».
# On connaît donc une partie de la liste, jamais sa totalité — voir PLANNING #19.
# --------------------------------------------------------------------------
terminaison:
  defaut:
    mot_cle: "Enter"
    confiance: A
    source: "manuel §00 « Enter »"
  liste_officielle_incomplete:
    confiance: A
    source: 'manuel §00 : "Some (but not all) of these commands are"'
    backlog: 19
    note: >
      ETC dit explicitement que sa propre liste est partielle. Toute action que
      le modèle ne marque pas `auto_termine` est donc PRÉSUMÉE avoir besoin
      d'`Enter`, sans preuve. C'est une présomption, pas un fait établi.

# --------------------------------------------------------------------------
# OBJETS — ce qu'on sélectionne / ce qu'on cible
# --------------------------------------------------------------------------
objets:
  Chan:
    mot_cle: "Chan"
    numerote: true
    plage: true
    confiance: A
    source: "manuel §6 Manual Control"
  Group:
    mot_cle: "Group"
    numerote: true
    plage: true
    confiance: A
    source: "manuel §7 Groups"
    note: >
      Un Group ne contient que des références de channels, jamais de niveaux
      (corpus #058). Les sous-groupes d'un Group comptent pour un seul channel
      lors d'un Fan (manuel §8, « Using Subgroups with Fan »).
  Cue:
    mot_cle: "Cue"
    numerote: true
    decimal: true
    plage: true
    liste: true              # `Cue <liste>/<numero>`, ex. Cue 2/5
    confiance: A
    source: "manuel §12 Cues & the Cue List"
    note: "numérotation 0.001 à 9999.999, 10 000 cues maximum"
  Part:
    mot_cle: "Part"
    numerote: true
    plage: true
    qualifie: Cue           # ne s'emploie jamais seul
    confiance: A
    source: "manuel §17 Multipart Cues, exemples de Fan de temps §8"
  Sub:
    mot_cle: "Sub"
    numerote: true
    plage: true
    confiance: A
    source: "manuel §20 Submasters"
    note: "1000 submasters maximum"
  Macro:
    mot_cle: "Macro"
    numerote: true
    plage: false
    confiance: A
    source: "manuel §24 Macros"
    note: "numérotation 1 à 99 999"
  Effect:
    mot_cle: "Effect"
    numerote: true
    plage: true
    confiance: A
    source: "manuel §18 Effects"
    note: >
      917 et 918 sont préprogrammés (arc-en-ciel RGB / CMY). Un effet
      step-based porte sa propre liste de channels ; un effet absolu non.

# --------------------------------------------------------------------------
# CIBLES RÉFÉRENCÉES — record targets citables en critère de Query
#
# Un même mot-clé désigne tantôt un objet (« sélectionne ce qui est dans la
# palette 2 »), tantôt une action (« applique la palette 2 »). Les deux emplois
# doivent écrire la MÊME chaîne : `build.py` le vérifie contre `actions`.
# --------------------------------------------------------------------------
cibles:
  Int Palette:   { mot_cle: "Int Palette",   action_associee: palette_intensite, confiance: A }
  Color Palette: { mot_cle: "Color Palette", action_associee: palette_couleur,   confiance: A }
  Focus Palette: { mot_cle: "Focus Palette", confiance: A }
  Beam Palette:  { mot_cle: "Beam Palette",  confiance: A }
  Preset:        { mot_cle: "Preset",        confiance: A }
  Cue:           { mot_cle: "Cue",           confiance: A }
  Effect:        { mot_cle: "Effect",        confiance: A }
  Group:         { mot_cle: "Group",         confiance: A }
  Sub:           { mot_cle: "Sub",           confiance: A }

# --------------------------------------------------------------------------
# OPÉRATEURS de sélection et de composition
# --------------------------------------------------------------------------
operateurs:
  plage:
    symbole: "Thru"
    confiance: A
    note: "porte nativement le mécanisme Fan (manuel §8)"
  ajout:
    symbole: "+"
    confiance: A
  retrait:
    symbole: "-"
    confiance: A
  liste:
    symbole: "/"
    confiance: A
    source: "manuel §12 et §16"
    note: >
      Polysémique selon la position : préfixe de cue list (`Cue 2/5`), séparateur
      montée/descente d'un temps (`Time 4/3`), ou pourcentage de temps de cue en
      timing discret (`Time /50` = 50 % du temps de cue). Le générateur doit
      connaître le contexte, comme pour `At`.
  creation_plage:
    symbole: "Thru Thru"
    confiance: A
    source: "manuel §20 : [Sub][1][Thru][Thru][1][0][Enter] crée les subs 1 à 10"
    note: "création en série depuis Blind — ce n'est pas une sélection"

# --------------------------------------------------------------------------
# FAN — répartition automatique de valeurs (grammaire consolidée §4, manuel §8)
#
# Fan n'est PAS une commande séparée : c'est le comportement implicite de toute
# commande de niveau ou de temps qui emploie `Thru` ou une liste de références.
# La touche `Fan` ne sert qu'à changer de style de répartition.
# --------------------------------------------------------------------------
fan:
  mot_cle: "Fan"
  confiance: A
  source: "manuel §8 Fan"

  implicite:
    description: >
      `Chan 1 Thru 5 At 10 Thru 50 Enter` répartit sans invoquer `Fan` :
      1=10 %, 2=20 %, 3=30 %, 4=40 %, 5=50 %. C'est la stratégie de génération
      en masse la plus fiable du projet (grammaire consolidée §13, stratégie 1).
    confiance: A
    source: "manuel §8, « Fan From the Command Line »"
  ordre_application:
    description: "Fan s'applique dans l'ordre de sélection des channels, ou dans l'ordre du groupe."
    confiance: A
  variante_console:
    description: >
      `[Fan]` est une hardkey sur Eos/Ion/Gio ; Ion Classic et Element Classic
      n'ont que le softkey `{Fan}`. Le mot posé sur la ligne de commande est le
      même — la différence est matérielle, pas syntaxique.
    confiance: A
    source: "manuel §8, notes répétées en tête de chaque section"

  # Ce que Fan accepte de répartir
  portees:
    intensite:  { exemple: "Chan 1 Thru 5 At 10 Thru 50 Enter",        confiance: A }
    temps:      { exemple: "Chan 1 Thru 5 Time 6 Thru 10 Enter",        confiance: A }
    delai:      { exemple: "Chan 1 Thru 5 Delay 6 Thru 8 Enter",        confiance: A }
    temps_cue:  { exemple: "Cue 1 Thru 5 Time 6 Thru 10 Enter",         confiance: A }
    temps_part: { exemple: "Cue 1 Part 1 Thru 3 Time 6 Thru 8 Enter",   confiance: A }
    references: { exemple: "Chan 1 Thru 5 Int Palette 1 Thru 3 Enter",  confiance: A }

  # Règle propre au fan de références (manuel §8, « Fanning References »)
  regle_references:
    trois_ou_plus: >
      3 références ou plus → les channels reçoivent de la donnée RÉFÉRENCÉE, et
      le motif se répète s'il y a plus de channels que de références
      (1..5 sur IP 1 Thru 3 → IP1, IP2, IP3, IP1, IP2).
    deux_ou_moins: >
      2 références ou moins → interpolation en donnée ABSOLUE entre les deux
      références, la référence est perdue (1..5 sur IP1=0 % / IP2=100 % →
      0, 25, 50, 75, 100 % en absolu).
    confiance: A
    consequence_generateur: >
      Un fan de palettes sur 2 références casse la référence sans le dire. Le
      générateur doit avertir quand l'intention exprimée était « appliquer des
      palettes » et que la liste n'en contient que deux.

  # Styles — le style change la répartition, jamais la commande qui la porte
  styles:
    Center:
      mot_cle: "{Center}"
      argument: aucun
      comportement: "le channel du milieu reste inchangé ; les extrêmes varient en sens opposés"
      confiance: A
      source: "manuel §8 (liste des softkeys)"
      osc: center
    Reverse:
      mot_cle: "{Reverse}"
      argument: aucun
      comportement: "inverse l'ordre de sélection avant d'appliquer le fan"
      confiance: A
      source: "manuel §8 (liste des softkeys)"
      osc: reverse
    Mirror Out:
      mot_cle: "{Mirror Out}"
      argument: aucun
      comportement: "le milieu est le point de départ, les extrémités les points d'arrivée"
      confiance: A
      source: "manuel §8, exemple chiffré : 1 Thru 10 At 10 Thru 30 Fan {Mirror Out}"
      osc: mirror_out
    Mirror In:
      mot_cle: "{Mirror In}"
      argument: aucun
      comportement: "inverse de Mirror Out"
      confiance: A
      source: "eosKeys.ts `mirror_in`→FAN_MIRROR_IN ; cité §4 grammaire consolidée"
      osc: mirror_in
      note: "existence confirmée A ; aucun exemple chiffré au manuel, contrairement à Mirror Out"
    Repeat:
      mot_cle: "{Repeat}"
      argument: entier
      comportement: "motif répété toutes les N channels"
      confiance: A
      source: "manuel §8, exemple chiffré : 1 Thru 12 At 50 Thru 70 Fan {Repeat} 3"
      osc: repeat
    Cluster:
      mot_cle: "{Cluster}"
      argument: entier
      comportement: "channels regroupés en paquets de valeur identique"
      confiance: A
      source: "manuel §8, exemple chiffré : 1 Thru 12 At 50 Thru 80 Fan {Cluster} 4"
      osc: cluster
    Random:
      mot_cle: "{Random}"
      argument: aucun
      comportement: "ordre randomisé avant application du fan"
      confiance: A
      source: "manuel §8 (liste des softkeys)"
      osc: random
    # --- existence confirmée A (eosKeys.ts), comportement jamais observé ---
    Interleave:
      mot_cle: "{Interleave}"
      argument: inconnu
      comportement: inconnu
      confiance: A            # porte sur l'existence de la touche, pas sur l'effet
      source: "eosKeys.ts `interleave`→FAN_INTERLEAVE"
      osc: interleave
      backlog: 9
    Jump:
      mot_cle: "{Jump}"
      argument: inconnu
      comportement: inconnu
      confiance: A
      source: "eosKeys.ts `jump`→FAN_JUMP"
      osc: jump
      backlog: 9
    Num Groups:
      mot_cle: "{Num Groups}"
      argument: inconnu
      comportement: inconnu
      confiance: A
      source: "eosKeys.ts `num_groups`→FAN_NUM_GROUPS"
      osc: num_groups
      backlog: 9
    Channels Per Group:
      mot_cle: "{Channels Per Group}"
      argument: inconnu
      comportement: inconnu
      confiance: A
      source: "eosKeys.ts `chan_per_group`→FAN_CHANNELS_PER_GROUP"
      osc: chan_per_group
      backlog: 9
    Curve:
      mot_cle: "{Curve}"
      argument: inconnu
      comportement: inconnu
      confiance: A
      source: "eosKeys.ts `fan_curve`→FAN_CURVE"
      osc: fan_curve
      backlog: 9
      note: "à ne pas confondre avec {Curve} des attributs de cue (manuel §12), homonyme"

# --------------------------------------------------------------------------
# QUERY — sélection conditionnelle
#
# Le SEUL endroit du langage Eos où existe une logique conditionnelle et une
# négation : ETC a confirmé par réponse directe qu'il n'y a pas de `Not`
# générique ailleurs (corpus #155, B). Toute logique conditionnelle du
# traducteur doit donc passer par ici, ou nulle part.
# --------------------------------------------------------------------------
query:
  mot_cle: "Query"
  confiance: A
  source: "manuel §15 « Advanced Manual Control », section Query"
  osc: query
  fin:
    description: "`Enter` clôt la requête et sélectionne le résultat"
    osc: end_query
    confiance: A
  parcours:
    description: "`Next` / `Last` parcourent le résultat un channel à la fois"
    confiance: A
  defaut:
    description: >
      Sans précision, Eos suppose que la requête porte sur la sortie courante :
      `{Is In}` est donc facultatif (manuel §15). Le générateur l'écrit quand
      même — une macro se relit, l'implicite y coûte plus cher qu'il ne rapporte.
    confiance: A
  mots_cles_patch:
    description: >
      Jusqu'à 10 mots-clés définis par channel en Patch peuvent servir de
      critère : `Query {mon mot-clé} {Can't Be} Beam Palette 5 Enter`. Propres
      au show file — le traducteur ne peut pas les connaître à l'avance.
    confiance: A

  # Chaque condition porte son nom OSC, ou `osc: null` si elle n'en a pas.
  # `osc: null` n'est pas un détail : sans touche OSC, la condition n'est
  # atteignable qu'au doigt — voir PLANNING #15.
  conditions:
    Is In:
      mot_cle: "{Is In}"
      attend: cible
      osc: is_in
      confiance: A
      optionnel: true
    Isn't In:
      mot_cle: "{Isn't In}"
      attend: cible
      osc: "isn't_in"
      confiance: A
      source: "manuel §31, liste officielle des touches OSC — absent de eosKeys.ts"
      note: >
        L'apostrophe a probablement fait échouer l'extraction de `eosKeys.ts`
        (corpus #148, résolu dans eosKeys_vs_manual_comparison.md). La touche
        existe bien : `isn't_in` → ISNT_IN.
    Can Be:
      mot_cle: "{Can Be}"
      attend: cible
      osc: can_be
      confiance: A
    Can't Be:
      mot_cle: "{Can't Be}"
      attend: cible
      osc: "can't_be"
      confiance: A
      source: "manuel §31, liste officielle des touches OSC — absent de eosKeys.ts"
    Or:
      mot_cle: "{Or}"
      attend: aucun
      osc: or
      confiance: A
    Moves Only:
      mot_cle: "{Moves Only}"
      attend: aucun
      osc: moves_only
      confiance: A
    Unpatched:
      mot_cle: "{Unpatched}"
      attend: aucun
      osc: unpatched
      confiance: A
      contextes: [Patch]
      note: "`Query {Unpatched} Delete Enter Enter` ne fonctionne QU'en Patch (manuel §15)"
    Mark:
      mot_cle: "{Mark}"
      attend: aucun
      osc: mark
      confiance: A
      element_classic: false
      note: "cue où l'intensité est active"
    Less Than:
      mot_cle: "{Less Than}"
      attend: valeur
      osc: less_than
      confiance: A
      note: "inclut l'égalité"
    Greater Than:
      mot_cle: "{Greater Than}"
      attend: valeur
      osc: greater_than
      confiance: A
      note: "inclut l'égalité"
    Track:
      mot_cle: "{Track}"
      attend: aucun
      osc: track
      confiance: A
      note: >
        Réutilise la hardkey `Track` : « Hardkeys on the face panel, such as
        [Time], can also be used to construct a query » (manuel §15).
    Block:
      mot_cle: "{Block}"
      attend: aucun
      osc: block
      confiance: A
    Assert:
      mot_cle: "{Assert}"
      attend: aucun
      osc: assert
      confiance: A
      element_classic: false
    Part:
      mot_cle: "{Part}"
      attend: aucun
      osc: part
      confiance: A
    Park:
      mot_cle: "{Park}"
      attend: aucun
      osc: park
      confiance: A
    Time:
      mot_cle: "{Time}"
      attend: valeur
      osc: time
      confiance: A
    Delay:
      mot_cle: "{Delay}"
      attend: valeur
      osc: delay
      confiance: A
    Capture:
      mot_cle: "{Capture}"
      attend: aucun
      osc: capture
      confiance: A
      element_classic: false
    # --- conditions sans touche OSC : atteignables au doigt seulement ---
    Broken Mark:
      mot_cle: "{Broken Mark}"
      attend: aucun
      osc: null
      confiance: A
      element_classic: false
      backlog: 15
    Marking:
      mot_cle: "{Marking}"
      attend: aucun
      osc: null
      confiance: A
      element_classic: false
      backlog: 15
      note: "cue future"
    Up Moves:
      mot_cle: "{Up Moves}"
      attend: aucun
      osc: null
      confiance: A
      backlog: 15
    Down Moves:
      mot_cle: "{Down Moves}"
      attend: aucun
      osc: null
      confiance: A
      backlog: 15
    Live Moves:
      mot_cle: "{Live Moves}"
      attend: aucun
      osc: null
      confiance: A
      backlog: 15
    Dark Moves:
      mot_cle: "{Dark Moves}"
      attend: aucun
      osc: null
      confiance: A
      backlog: 15
    Autoblock:
      mot_cle: "{Autoblock}"
      attend: aucun
      osc: null
      confiance: A
      backlog: 15
      note: >
        `autoblock_clean` → AUTOBLOCK_CLEANUP existe en OSC, mais c'est le
        nettoyage des auto-blocks, pas la condition de requête. Ne pas confondre.

# --------------------------------------------------------------------------
# ACTIONS — ce qu'on applique
# --------------------------------------------------------------------------
actions:
  couleur_gel:
    mot_cle: "Color"
    attend: gel              # <nuancier>/<teinte>, ex. 3/195 = Lee 195
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §10 Palettes"
  intensite:
    mot_cle: "At"
    attend: pourcentage
    fanable: true
    contextes: [Live, Blind]
    confiance: A
    avertissement: >
      Polysémie confirmée : en contexte Patch, `At` désigne une adresse DMX,
      pas une intensité. Le générateur doit connaître son contexte.
  record_palette_couleur:
    mot_cle: "Record Color Palette"
    attend: cible_numerotee
    label: optionnel         # `Label <texte>`
    contextes: [Live]
    confiance: A
    source: "manuel §10 Palettes"
  palette_intensite:
    mot_cle: "Int Palette"
    attend: cible_numerotee
    fanable: true
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §8 « Fanning References », manuel §10"
    avertissement: "voir fan.regle_references : 2 références ou moins cassent la référence"
  palette_couleur:
    mot_cle: "Color Palette"
    attend: cible_numerotee
    fanable: true
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §10 Palettes ; fan de références par analogie avec Int Palette (§8)"
    note: >
      Le manuel illustre le fan de références sur `Int Palette` uniquement, mais
      énonce la règle pour « les références, telles que les palettes » en général.

  # -- temps et délais ------------------------------------------------------
  temps:
    mot_cle: "Time"
    attend: duree
    fanable: true
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §12 « Timing »"
    note: >
      Positionnel : le 1er `Time` = montée d'intensité, le 2e = descente, puis
      focus, couleur, beam. `Time 4/3` sépare montée et descente sur une seule
      frappe. `Time` seul, sans valeur, remet au défaut du Setup.
  delai:
    mot_cle: "Delay"
    attend: duree
    fanable: true
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §12 « Delay Time »"

  # -- cues -----------------------------------------------------------------
  record_cue:
    mot_cle: "Record Cue"
    attend: cible_numerotee
    label: optionnel
    contextes: [Live]
    confiance: A
    source: "manuel §12 « Using Record in Live »"
    note: >
      Le manuel note `[Record] <Cue> [5]` : `Cue` est facultatif, le clavier
      passe en mode cue par défaut après `Record`. Le générateur l'écrit
      toujours explicitement — une macro se relit et se réimporte, l'implicite
      y coûte plus cher qu'il ne rapporte.
  record_only_cue:
    mot_cle: "Record Only Cue"
    attend: cible_numerotee
    label: optionnel
    contextes: [Live]
    confiance: A
    source: "manuel §12 « Using Record Only in Live »"
    note: >
      Ne stocke que les valeurs manuelles — exclut les apports des submasters et
      des autres cue lists. Sur Element Classic, s'obtient par `Record Record`.
  update_cue:
    mot_cle: "Update Cue"
    attend: cible_numerotee
    contextes: [Live]
    confiance: A
    source: "manuel §12 « [Update] »"
    avertissement: >
      Cible ambiguë et préférences persistantes entre sessions ({Make Absolute},
      {Break Nested}) — risque référencé A/C au référentiel. Ne jamais générer
      un `Update` nu sans expliciter la cible.
  go_to_cue:
    mot_cle: "Go To Cue"
    attend: cible_numerotee   # ou Out / Next / Last / Home
    objet_implicite: Cue      # la cible est dans le mot-clé, pas dans une sélection
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §16 « Go To Cue »"
    avertissement: >
      Exécution non déterministe en macro selon Foreground/Background et le
      timing (corpus #060, #061) — voir PLANNING #7 et #14. Et jamais de
      concaténation : `Go_To_Cue_5` tronque la décimale, il faut des tokens
      séparés.
  cue_link:
    mot_cle: "Link/Loop"
    attend: cible_numerotee
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §12 « Link / Loop »"
    note: >
      Même softkey pour le lien et la boucle : `Cue 2 {Link/Loop} 1 {Link/Loop} 3`
      = lien de 2 vers 1, répété 3 fois. `0` boucle indéfiniment. Toutes les cues
      d'une boucle doivent porter un Follow ou un Hang.

  # -- submasters -----------------------------------------------------------
  record_sub:
    mot_cle: "Record Sub"
    attend: cible_numerotee
    label: optionnel
    contextes: [Live]
    confiance: A
    source: "manuel §20 « Recording a Submaster »"
    note: >
      Sur un sub déjà rempli, un enregistrement sélectif FUSIONNE au lieu de
      remplacer. Pour remplacer, `Rem Dim` ou suppression préalable.
  record_only_sub:
    mot_cle: "Record Only Sub"
    attend: cible_numerotee
    label: optionnel
    contextes: [Live]
    confiance: A
    source: "manuel §20 « Recording a Submaster »"
  update_sub:
    mot_cle: "Update Sub"
    attend: cible_numerotee
    contextes: [Live]
    confiance: A
    source: "manuel §20 « Updating a Submaster »"
  sub_bump_bas:
    mot_cle: "SubDown"
    attend: cible_numerotee
    objet_implicite: Sub
    contextes: [Live]
    confiance: B
    source: "eosKeys.ts `subdown`→SUB_BUMP_DOWN (A) ; ordre `SubDown <n> Enter` corpus #026 (C)"
    avertissement: >
      La touche est confirmée A, l'ordre des tokens seulement C/B (un membre
      expérimenté corrigeant une macro cassée). Et surtout : survie à l'aller-
      retour ASCII non confirmée — PLANNING #1, priorité haute.
  sub_bump_haut:
    mot_cle: "SubUp"
    attend: cible_numerotee
    objet_implicite: Sub
    contextes: [Live]
    confiance: B
    source: "eosKeys.ts `subup`→SUB_BUMP_UP (A) ; ordre `SubUp <n> Enter` corpus #026 (C)"
    avertissement: "mêmes réserves que SubDown — PLANNING #1"
  temps_bump_sub:
    mot_cle: "Time"
    attend: triplet_duree     # montée / dwell / descente
    contextes: [Live]
    confiance: A
    source: "manuel §20 « Using Bump Button Timing With Submasters »"
    note: >
      `Sub 8 Time 3 Time 4 Time 3 Enter` = 3 s de montée, 4 s de dwell, 3 s de
      descente. Le dwell accepte {Manual} (défaut) et {Hold} à la place d'une
      durée. `Sub 3 Time Enter` remet tout au défaut.

  # -- macros ---------------------------------------------------------------
  appel_macro:
    mot_cle: "Macro"
    attend: cible_numerotee
    contextes: [Live, contenu_macro]
    confiance: A
    source: "manuel §24 « Play a Macro » et « Creating Macros »"
    avertissement: >
      En fin de contenu d'une autre macro, c'est le chaînage macro-dans-macro :
      syntaxe A, fiabilité d'exécution C (corpus #070 vs #095) — PLANNING #2.
  # -- intensité : formes courtes, souvent auto-terminantes -----------------
  hors_scene:
    mot_cle: "Out"
    attend: aucun
    auto_termine: true
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §00 (liste des commandes auto-terminantes) ; §6 exemple `Group 9 Out`"
    osc: out
  plein_feu:
    mot_cle: "Full"
    attend: aucun
    auto_termine: false
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §6 « [1] [Full] [Full] »"
    osc: full
    note: >
      `Full` seul demande `Enter` ; le DOUBLE appui `Full Full` auto-termine
      (manuel §6). Deux commandes différentes sous un même mot.
  niveau_setup:
    mot_cle: "Level"
    attend: aucun
    auto_termine: true
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §00 et §6 : « [1] [Level] »"
    osc: level
    note: "valeur réglée dans le Setup — 80 % par défaut, pas une constante"
  incrementer:
    mot_cle: "+%"
    attend: aucun
    auto_termine: true
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §00 et §6"
    osc: "+%"
    note: >
      Le pas est réglé dans le Setup. Le nom interne `PLUS10` reflète le défaut
      de 10 %, pas une valeur figée — deux appuis font 20 % au défaut.
  decrementer:
    mot_cle: "-%"
    attend: aucun
    auto_termine: true
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §00 et §6 : « [-%] [-%] … This command is self-terminating »"
    osc: "-%"
  valeur_dmx:
    mot_cle: "At / /"
    attend: valeur
    auto_termine: false
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §6 : « [1] [At] [/] [/] [2][3][9] [Enter] »"
    note: "valeur DMX brute 0-255, pas un pourcentage — troisième sens du `/`"
  sneak:
    mot_cle: "Sneak"
    attend: aucun
    auto_termine: false
    contextes: [Live]
    confiance: A
    source: "manuel §6 ; manuel §24 (exemple de macro `Sneak Time 10 Enter`)"
    osc: sneak
    note: >
      `Sneak Sneak` pose `{AllNPs} Sneak` et auto-termine (manuel §6) — encore
      un double appui qui change la commande.
  focus_onglet:
    mot_cle: "Tab"
    attend: cible_numerotee
    auto_termine: false
    contextes: [Live, Blind, Patch]
    confiance: A
    source: "corpus #168, réponse officielle ETC"
    osc: tab
    note: >
      `Tab <n> Enter` amène le focus sur l'écran n. Préalable obligatoire à
      toute commande dont le sens dépend de l'écran — `At` au premier chef.

  # -- patch ----------------------------------------------------------------
  patcher:
    mot_cle: "At"
    attend: adresse
    auto_termine: false
    contextes: [Patch]
    confiance: A
    source: "manuel §4 « Patching By Channel »"
    avertissement: >
      Même mot-clé que l'intensité, sens opposé — et à l'intérieur même de
      Patch, le sens s'inverse encore selon le mode Format. Voir
      contexte.modes_patch. Le générateur ne l'émet qu'en mode par channel.
    mode_requis: par_channel
  patcher_par_adresse:
    mot_cle: "Address"
    attend: adresse_puis_channel
    auto_termine: false
    contextes: [Patch]
    confiance: A
    source: "manuel §4 : « [Address] [5][1][3] [At] [8] [Enter] »"
    note: >
      Forme NON ambiguë : le préfixe `Address` force l'interprétation quel que
      soit le mode Format. C'est la seule parade documentée au piège du mode,
      donc la forme que le générateur privilégie pour patcher par adresse.
    osc: address
  patch_univers:
    mot_cle: "At"
    attend: univers_adresse       # `At 2 / 146`
    auto_termine: false
    contextes: [Patch]
    confiance: A
    source: "grammaire consolidée §3 : `603 At 2 / 146` — 2e univers, adresse 146"
  retirer_adresse:
    mot_cle: "At"
    attend: aucun
    auto_termine: false
    contextes: [Patch]
    confiance: A
    source: "grammaire consolidée §3 : `[601] [At] [Enter]` retire l'adresse, garde le type"
  depatcher:
    mot_cle: "Unpatch"
    attend: aucun
    auto_termine: false
    contextes: [Patch]
    confiance: A
    source: "manuel §4 ; grammaire consolidée §3"
    note: "restaure les propriétés par défaut — retire adresse, type, label"
  patch_hors_sortie:
    mot_cle: "At 0"
    attend: aucun
    auto_termine: false
    contextes: [Patch]
    confiance: A
    source: "manuel §4 : « [n] [At] [0] [Enter] »"
    note: >
      Le channel reste manipulable et enregistrable mais ne sort rien. À ne pas
      confondre avec la suppression, qui interdit toute donnée.
  supprimer:
    mot_cle: "Delete"
    attend: aucun
    auto_termine: false
    contextes: [Patch, Live, Blind]
    confiance: A
    source: "manuel §4 : « [6] [Thru] [1][0] [Delete] [Enter] [Enter] »"
    avertissement: >
      Double `Enter` de confirmation. Les données programmées d'un channel
      supprimé sont perdues — le manuel le signale en CAUTION.
    confirmation: true
  patch_courbe:
    mot_cle: "Curve"
    attend: cible_numerotee
    auto_termine: false
    contextes: [Patch]
    confiance: A
    source: "manuel §4 : « [1] {Curve} [4] [Enter] »"
    osc: curve
  patch_preheat:
    mot_cle: "Preheat"
    attend: pourcentage
    auto_termine: false
    contextes: [Patch]
    confiance: A
    source: "manuel §4 : « [1] {Preheat} [0][3] [Enter] »"
    osc: preheat
  patch_proportion:
    mot_cle: "Proportion"
    attend: pourcentage
    auto_termine: false
    contextes: [Patch]
    confiance: A
    source: "manuel §4 : « [1] {Attributes} {Proportion} [1][2][5] [Enter] »"
    osc: proportion
    note: "`Proportion Enter` sans valeur retire la proportion appliquée"

  # -- sélection ------------------------------------------------------------
  selection_active:
    mot_cle: "Select Active"
    attend: aucun
    contextes: [Live]
    confiance: A
    source: "eosKeys.ts `select_active`→SELECT_ACTIVE ; manuel §24 (exemple de macro)"
    note: "sélectionne tous les channels actifs — intensité > 0 ou en mouvement"
  selection_derniere:
    mot_cle: "Select Last"
    attend: aucun
    contextes: [Live]
    confiance: A
    source: "eosKeys.ts `select_last`→SELECT_LAST"
    avertissement: >
      Après une Query composée, rapporté comme relançant la syntaxe de la
      requête au lieu de renvoyer la sélection (corpus #083) — PLANNING #17.
      C'est exactement la combinaison qu'exige la stratégie de génération en
      masse n° 2 appliquée à une sélection conditionnelle.

  # -- effets ---------------------------------------------------------------
  appliquer_effet:
    mot_cle: "Effect"
    attend: cible_numerotee
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §18 « Apply an Existing Effect »"
    note: >
      Un effet step-based porte une liste de channels embarquée : il se rappelle
      par `Recall From Effect <n> Enter` sans sélection préalable.
  retirer_effet:
    mot_cle: "Effect At"
    attend: aucun
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §18 « Stopping Effects »"
    note: >
      `<sélection> Effect At Enter` retire l'instruction d'effet des channels
      sélectionnés. Le manuel documente aussi `Effect <n> At Enter` pour arrêter
      l'effet entier, mais le générateur ne l'émet pas : `At` y change de sens
      selon ce qui précède, et `Stop Effect <n> Enter` dit la même chose sans
      ambiguïté.
  arreter_effet:
    mot_cle: "Stop Effect"
    attend: cible_optionnelle
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §18 « Assigning a Stop Effect Command »"
    note: >
      Trois portées distinctes, à ne pas confondre : `Stop Effect Enter` arrête
      TOUS les effets en cours ; `Stop Effect <n> Enter` un effet précis ;
      `<sélection> Stop Effect Enter` pose une instruction d'arrêt sur les
      channels. Le double appui (`Stop Effect Stop Effect`) est un « stop all »
      qui pose des drapeaux même là où aucun effet ne tourne.
  effet_bpm:
    mot_cle: "BPM"
    attend: valeur
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §18, exemple : Effect 1 {BPM} 190 Enter"
    note: >
      Ajuste les temps de step (effet step-based) ou le time/dwell (effet
      absolu). Sur un effet qui tourne, le changement est immédiat mais les
      temps stockés ne bougent pas — c'est un override, à enregistrer ensuite.

  label:
    mot_cle: "Label"
    attend: texte
    contextes: [Live, Blind]
    confiance: A
    source: "manuel §12, §20, §24"
    note: >
      `Label Label` retire le libellé. `||` ou CTRL+J insère un retour à la ligne.
      Comportement du clavier virtuel avec espaces et tirets non observé —
      PLANNING #5.

# --------------------------------------------------------------------------
# MODIFICATEURS — softkeys qui qualifient une action, jamais autonomes
# --------------------------------------------------------------------------
modificateurs:
  Q Only:
    mot_cle: "Q Only"
    porte_sur: [record_cue, record_only_cue, update_cue]
    confiance: A
    source: "manuel §12 « Cue Only / Track »"
    osc: cueonly
    note: >
      `Q Only` et `Track` sont la MÊME touche physique : elle prend le sens
      inverse du réglage système. Le générateur doit connaître le mode de la
      console pour poser le bon mot — sinon il inverse le comportement voulu.
  Track:
    mot_cle: "Track"
    porte_sur: [record_cue, record_only_cue, update_cue]
    confiance: A
    source: "manuel §12 « Cue Only / Track »"
    osc: track
  Trace:
    mot_cle: "Trace"
    porte_sur: [update_cue]
    confiance: A
    source: "manuel §12 « Update Using Trace »"
    osc: trace
    note: "`Trace Trace` force au-delà du premier obstacle (channel inactif dans la cue)"
  Rem Dim:
    mot_cle: "Rem Dim"
    porte_sur: [record_cue, record_sub]
    confiance: A
    source: "manuel §12 et §20"
    osc: rem_dim
  Complete:
    mot_cle: "Complete"
    porte_sur: [go_to_cue]
    confiance: A
    source: "manuel §16 « Other Go To Cue Options »"
    osc: complete
  MovesOnly:
    mot_cle: "MovesOnly"
    porte_sur: [go_to_cue]
    confiance: A
    source: "manuel §16"
    osc: moves_only
  MinusLinks:
    mot_cle: "MinusLinks"
    porte_sur: [go_to_cue]
    confiance: A
    source: "manuel §16"
    osc: minus_links
  SingleParam:
    mot_cle: "SingleParam"
    porte_sur: [go_to_cue]
    confiance: A
    source: "manuel §16"
    osc: single_param
  MultiParam:
    mot_cle: "MultiParam"
    porte_sur: [go_to_cue]
    confiance: A
    source: "manuel §16"
    osc: multi_param
  Manual:
    mot_cle: "Manual"
    porte_sur: [go_to_cue, temps, temps_bump_sub]
    confiance: A
    source: "manuel §12, §16, §20"
    osc: manual

# Règle d'ordre confirmée A (manuel §16) : sur un Go To Cue, `Time` se pose
# TOUJOURS après les autres modificateurs. Seule exception : {Manual}.
ordre_modificateurs:
  go_to_cue:
    regle: "modificateurs d'abord, `Time` en dernier ; {Manual} exempté"
    confiance: A
    source: "manuel §16, note en fin de « Other Go To Cue Options »"

# --------------------------------------------------------------------------
# CONTRÔLE DE MACRO — tokens valides seulement DANS un contenu de macro
# --------------------------------------------------------------------------
macro:
  creation:
    learn:
      forme: "Learn <n> Enter <contenu> Learn"
      confiance: A
      source: "manuel §24 « Using the [Learn] Key »"
      note: >
        Voie primaire recommandée par ETC. Tout est enregistré, y compris un
        `Clear` de rattrapage — la frappe fautive pollue le contenu.
      touches_exclues: ["Macro", "flèches", "Escape", "Select", "Learn"]
    editeur:
      forme: "Macro <n> Enter {Edit} <contenu> Select"
      confiance: A
      source: "manuel §24 « Creating Macros »"
      note: "voie secondaire/corrective selon la doctrine ETC ; `Select` valide, `Escape` annule"

  modes:
    defaut_projet: Foreground
    justification: >
      Règle de génération retenue par le projet : Foreground sauf raison
      explicite. Couvre {Target} vers un User (ne fonctionne qu'en Foreground,
      corpus #068) et limite le non-déterminisme de Go To Cue (corpus #061).
    Foreground: { osc: foreground_mode, interne: MACRO_USER,           confiance: A }
    Background: { osc: background_mode, interne: MACRO_BACKGROUND,     confiance: A }
    Default:    { osc: default_mode,    interne: MACRO_DEFAULT_MODE,   confiance: A }
    selecteur:  { osc: macro_mode,      interne: MACRO_MODE,           confiance: A }
    note: >
      Trois touches OSC distinctes, pas trois positions d'un même softkey
      (correction corpus vague 29 via eosKeys.ts).

  controle:
    Loop Begin:
      mot_cle: "{Loop Begin}"
      variante_commande: "Macro_Loop_Begin"
      argument: entier
      confiance: A
      source: "manuel §24 « Macro-Specific Softkeys »"
      osc: macro_loop_begin
      note: "0 itération = boucle infinie"
    Loop End:
      mot_cle: "{Loop End}"
      variante_commande: "Macro_Loop_End"
      argument: aucun
      confiance: A
      source: "manuel §24"
      osc: macro_loop_end
    Wait:
      mot_cle: "{Wait}"
      variante_commande: "Macro_Wait"
      argument: entier_obligatoire
      confiance: A
      source: "manuel §24 : « needs to be followed with a whole number of seconds »"
      osc: macro_wait
