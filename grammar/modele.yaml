    valide: non
    confiance: S
    note: >
      Assert n'a pas de mot-clé de ligne de commande : `Sub n Assert#` échoue en
      erreur de syntaxe (journal terrain, confiance S). Plus généralement, le
      pilotage de niveau d'un sub passe par le fader ou les bumps, pas par `At`.
      Entrée conservée pour que le générateur refuse explicitement au lieu de
      tomber dans le trou « combinaison absente du modèle ».

