    action: appel_macro
    valide: oui
    confiance: A
    note: "`Macro 5 Enter` depuis la ligne de commande (manuel §24)"

  # --- zones non tranchées ---
  - combinaison: "Group <n> + <a> Thru <b>"
    valide: inconnu
    confiance: null
    backlog: 4
    note: >
      Mélanger un groupe et une plage de channels dans une même sélection.
      Transporté sans erreur par le simulateur (test-client3.ts), ce qui ne
      prouve rien syntaxiquement. Aucun exemple exact dans le corpus ni le manuel.

  - combinaison: "Record Color Palette <n> Label <texte multi-mots>"
    valide: inconnu
    confiance: null
    backlog: 5
    note: >
      Comportement réel du clavier virtuel avec espaces et tirets dans le
      libellé — non observé.

  - combinaison: "Fan {Interleave} | {Jump} | {Num Groups} | {Channels Per Group} | {Curve}"
    valide: inconnu
    confiance: null
    backlog: 9
    note: >
      Cinq styles de Fan dont l'existence est confirmée A par eosKeys.ts mais
      dont ni le manuel ni le corpus ne décrit le comportement, ni même le
      nombre d'arguments attendus. Générer l'un d'eux serait produire une
      commande dont le projet ne sait pas prédire l'effet.

  - combinaison: "Fan {Mirror}"
    valide: inconnu
    confiance: null
    backlog: 13
    note: >
      Le manuel §8 emploie `{Mirror}` dans trois exemples (« Fanning Parameter
      Data », « Fan From the Command Line », fan de délais) alors que sa propre
      liste de softkeys ne documente que `{Mirror Out}` et `{Mirror In}` —
      et eosKeys.ts ne connaît que `mirror_in` / `mirror_out` (plus
      `mirror_mode`→MIRROR, dont le rapport au Fan n'est pas établi).
      L'exemple `1 Thru 5 At 10 Thru 30 Fan {Mirror}` donne le même résultat
      chiffré que l'exemple `{Mirror Out}` : abréviation rédactionnelle
      probable, jamais confirmée. Le générateur écrit `{Mirror Out}` en clair
      et n'émet jamais `{Mirror}`.

  - combinaison: "macro contenant SubDown/SubUp → export/import ASCII"
    valide: inconnu
    confiance: null
    backlog: 1
    note: >
      Corpus #027 : une macro apprise sur un bump de submaster ne se relit pas
      correctement après un aller-retour ASCII. Si confirmé, contrainte dure sur
      le format d'export du traducteur, pas seulement sur la syntaxe générée.

  - combinaison: "Macro <n> Enter en fin de contenu de macro"
    valide: inconnu
    confiance: null
    backlog: 2
    note: >
      Chaînage macro-dans-macro : syntaxe confirmée A par le manuel §24, mais
      corpus #070 et #095 se contredisent sur la fiabilité d'exécution réelle.
      La syntaxe est sûre, l'exécution ne l'est pas — distinction que le modèle
      doit garder visible.

  - combinaison: "Go To Cue <décimale> depuis une macro"
    valide: inconnu
    confiance: null
    backlog: 7
    note: >
      Deux problèmes distincts sous le même nom. (a) Troncature de la décimale
      si la commande est concaténée en une chaîne unique (corpus #060) — évitée
      par construction ici, le générateur produit des tokens séparés. (b)
      Exécution non déterministe selon Foreground/Background et le timing
      (corpus #061) — non évitable par construction, voir PLANNING #14.

  - combinaison: "Go To Cue en macro Background"
    valide: inconnu
    confiance: null
    backlog: 14
    note: >
      Corpus #061, témoignage technique dense avec logs : le Go To Cue n'est pas
      toujours exécuté en Background, ou l'est sur la mauvaise cue list. Le
      projet force Foreground par défaut, ce qui limite le risque sans le lever.

  - combinaison: "Fan de références sur exactement 2 palettes"
    valide: non
    confiance: A
    note: >
      Syntaxiquement accepté, mais casse l'intention : avec 2 références ou
      moins, Eos interpole en données ABSOLUES et perd la référence (manuel §8,
      « Fanning References »). Marqué `non` parce que le résultat contredit ce
      que l'utilisateur a demandé — c'est un piège, pas une erreur de syntaxe.
