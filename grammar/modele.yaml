# --------------------------------------------------------------------------
# OSC — couche d'injection
#
# C'est par ici que tout ce qui précède atteint la console. Une commande
# correctement engendrée mais mal injectée ne vaut rien.
# --------------------------------------------------------------------------
osc:
  prefixe: "/eos/"
  prefixe_utilisateur: "/eos/user/<n>/"
  confiance: A
  source: "manuel §31 « Show Control » ; recoupé S par reference/JOURNAL_observations_nomad.md"
  note: >
    Toute commande OSC commence par `/eos/…` ou `/eos/user/<n>/…` (manuel §31).
    Chaque adresse ci-dessous accepte la variante utilisateur.

  ligne_commande:
    cmd:
      adresse: "/eos/cmd"
      arguments: "chaîne de ligne de commande, arguments de substitution optionnels"
      confiance: A
    newcmd:
      adresse: "/eos/newcmd"
      reinitialise: true
      confiance: A
      note: "identique à cmd, mais réinitialise la ligne de commande d'abord"
      usage_projet: >
        Adresse retenue par défaut : deux macros y ont déjà transité au banc de
        transport (reference/tools/test-client.ts et test-client3.ts).
    event:
      adresse: "/eos/event"
      confiance: A
      note: "identique à cmd, mais traité comme un évènement console"
    newevent:
      adresse: "/eos/newevent"
      reinitialise: true
      confiance: A
    forme_chemin:
      adresse: "/eos/cmd/<mot>/<mot>/…"
      confiance: A
      note: "les tokens deviennent des segments d'adresse — `/eos/cmd/Chan/1/At/75`"

    terminaison:
      confiance: A
      formes:
        - { forme: "mot `Enter` littéral en fin de chaîne", retenue: true,
            note: "forme employée au banc de transport — celle que le générateur produit" }
        - { forme: "`#` en fin de chaîne", retenue: false }
        - { forme: "aucune", resultat: "ligne de commande non terminée, laissée en attente" }
    substitution:
      forme: "%1, %2, … remplacés par les arguments OSC dans l'ordre"
      confiance: A
      exemple: '/eos/cmd="Chan %1 At %2#", 1, 75'

  touche:
    adresse: "/eos/key/<nom>"
    arguments: "front de bouton optionnel : 1.0 = appui, 0.0 = relâchement"
    confiance: A
    nommage:
      retenu: underscore
      note: >
        Deux sources ETC se contredisent : la liste canonique du manuel §31
        écrit `select_active`, l'exemple d'usage du même chapitre écrit
        `select active`. Le générateur n'émet que la forme underscore de
        `reference/eosKeys.ts` — PLANNING #16.
      backlog: 16
    exception_slash: "pour la touche slash, utiliser un antislash : `/eos/key/\\`"

  macro:
    selection: { adresse: "/eos/macro", arguments: "numéro", confiance: A }
    execution: { adresse: "/eos/macro/fire", arguments: "numéro", confiance: A }
    front:
      adresse: "/eos/macro/<n>/fire"
      arguments: "1.0 = appui, 0.0 = relâchement"
      confiance: A
    usage_projet: >
      `/eos/macro/fire` est l'adresse normative du moteur d'injection de macro
      de macro2eos (grammaire consolidée §11.1).

  utilisateur:
    adresse: "/eos/user"
    arguments: "numéro d'utilisateur ; 0 = utilisateur d'arrière-plan"
    confiance: A
    recommandation: >
      Réserver un User# dédié au client OSC dès la connexion plutôt que
      d'hériter de celui de la console primaire (corpus #066, B).

  retour:
    ligne_commande:
      adresses: ["/eos/out/cmd", "/eos/out/user/<n>/cmd"]
      arguments: "(texte, flag_erreur) — 1 = erreur de syntaxe, 0 = ok"
      confiance: S
      source: "journal terrain nomad 3.3.5.69 ; manuel §31 ; Eos 2.6.0+"
      usage_projet: >
        Mécanisme de validation en temps réel : envoyer, lire le flag, alerter
        avant de graver la macro. Complète la validation statique, ne la
        remplace pas.
    prefixe_sortie:
      regle: "toute sortie Eos non-banque est préfixée `/eos/out/`"
      confiance: S
      source: "journal terrain"

  regles:
    - id: pas_de_republication_sub
      regle: "ne jamais attendre de retour de niveau sur `/eos/sub/<n>`"
      motif: >
        Silence total confirmé au banc après changement de niveau — le feedback
        passe exclusivement par les banques de faders `/eos/fader/<bank>/<n>`.
      confiance: S
    - id: assert_hors_ligne_de_commande
      regle: "ne jamais générer `Sub <n> Assert` en `cmd`/`newcmd`"
      motif: >
        `/eos/newcmd \"Sub n Assert#\"` renvoie une erreur de syntaxe — constat
        de banc. Assert n'a pas de mot-clé de ligne de commande ; le
        contournement OSC est `/eos/user/1/fader/1/<n>/stop`.
      confiance: S
    - id: accolades_non_confirmees
      regle: >
        signaler toute commande contenant un token `{…}` avant de l'injecter en
        chaîne `cmd`/`newcmd`
      motif: >
        Aucun exemple, nulle part, ne montre d'accolades dans une chaîne de
        ligne de commande OSC. Le seul softkey documenté en `cmd` est écrit en
        mots sans accolades. Si elles ne passent pas, il faut décomposer en
        `/eos/key/<nom>` séparés.
      confiance: null
      backlog: 18

