# Patrons — recettes éprouvées, couche haute
#
# Raccourcis pour les demandes courantes. Chaque patron se ramène à une suite
# d'instructions du modèle (`modele.yaml`) : un patron n'invente jamais de
# syntaxe, il pré-remplit une intention connue.
#
# `origine` trace d'où vient la recette (corpus, manuel, test simulateur).

meta:
  version: "0.1"
  maj: "2026-08-01"

patrons:
  - id: selection_plage_couleur
    intention: "mettre une plage de circuits dans une couleur de nuancier"
    exemple_nl: "circuits 10 à 20 en Lee 195"
    ir:
      - selection: { objet: Chan, de: "{debut}", a: "{fin}" }
        action:    { type: couleur_gel, nuancier: "{nuancier}", teinte: "{teinte}" }
    rend: "Chan {debut} Thru {fin} Color {nuancier}/{teinte} Enter"
    confiance: A
    origine: "manuel §10 ; transport validé test-client.ts"

  - id: selection_mixte_couleur_puis_palette
    intention: "sélectionner groupe + circuits, colorer, enregistrer en palette"
    exemple_nl: >
      groupe 5 et circuits 1 à 6 en Lee 195, enregistrer dans la palette
      couleur 5 appelée "195-Par LED"
    ir:
      - selection: { objet: Group, numero: "{groupe}", plus_plage: ["{debut}", "{fin}"] }
        action:    { type: couleur_gel, nuancier: "{nuancier}", teinte: "{teinte}" }
      - action:    { type: record_palette_couleur, cible: "{palette}", label: "{label}" }
    rend: |
      Group {groupe} + {debut} Thru {fin} Color {nuancier}/{teinte} Enter
      Record Color Palette {palette} Label {label} Enter
    confiance: null
    avertissements: [4, 5]      # renvois PLANNING.md — sélection mixte + label multi-mots
    origine: "généré session 2026-07-31 ; transport validé test-client3.ts, syntaxe NON validée"

  - id: selection_channels_fcb_dans_cue
    intention: "sélectionner uniquement les channels ayant des valeurs Focus/Color/Beam enregistrées dans une cue donnée"
    exemple_nl: "les channels avec des valeurs FCB dans la cue 0.5"
    rend: "Group Cue {n} - Select Active Enter"
    confiance: S
    origine: "testé au banc par l'utilisateur, 2026-09-18"
    note: >
      {n} est un numéro de cue réel (ex. 0.5), pas une part de cue — confirmé
      par l'utilisateur. Le tiret est le signe moins (retrait), pas un
      séparateur d'écriture. Effet observé au banc : sélectionne uniquement
      les channels enregistrés avec des valeurs Focus/Color/Beam dans la Cue
      {n}. Mécanisme interne NON documenté ailleurs dans ce dépôt : ni la
      combinaison Group+Cue sur la ligne de commande, ni Select Active comme
      filtre FCB n'apparaissent dans le manuel d'exploitation consulté à ce
      jour (voir §12 cues-the-cue-list, §07 groups). Le mot-clé `Group` ici
      pourrait ne pas désigner l'objet Group de `modele.yaml` (sélection
      d'un groupe numéroté) mais un mécanisme différent lié à la cue —
      déduction, non tranchée. À vérifier/rapprocher du manuel avant
      d'étendre `modele.yaml`.
      Confirmé au banc le 2026-09-18 (voir grammar/refus_terrain.yaml) : le
      préfixe `Group` est OBLIGATOIRE — `Cue {n} - Select Active` seul,
      sans `Group`, est rejeté par la console dès `Cue {n} -`.
